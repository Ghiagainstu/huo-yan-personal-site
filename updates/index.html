<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>更新历程 · 儿童英语学园</title>
<link rel="icon" href="../assets/icon-192.png">
<link rel="stylesheet" href="../assets/css/workbench.css">
<style>
  .upd-page{max-width:760px;margin:0 auto;padding:34px 20px 70px}
  .upd-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
  .upd-back{font-size:14px;color:var(--sub);text-decoration:none}
  .upd-back:hover{color:var(--gold-dark)}
  .upd-page h1{font-size:26px;font-weight:700;letter-spacing:.01em}
  .upd-page .sub{font-size:13px;color:var(--sub);margin:6px 0 22px}
  .search-line{margin:0 0 22px}
  .upd-latest{
    background:var(--gold-bg);border:1px solid var(--gold);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:26px;
  }
  .upd-latest .u-date{font-size:12px;font-weight:600;color:var(--gold-dark);letter-spacing:.04em}
  .upd-latest .u-title{font-size:17px;font-weight:700;margin:4px 0 8px}
  .upd-latest ul{margin:0;padding-left:18px}
  .upd-latest li{font-size:14px;margin:4px 0;line-height:1.5}
  .u-node{margin-bottom:22px}
  .u-node .u-date{font-size:13px;font-weight:600;color:var(--ink)}
  .u-node .u-title{font-size:15px;font-weight:600;margin:2px 0 6px}
  .u-node ul{margin:0;padding-left:18px}
  .u-node li{font-size:14px;color:var(--ink);margin:3px 0;line-height:1.5}
  .u-empty{font-size:13px;color:var(--sub);padding:14px 2px}
  @media (max-width:768px){.upd-page{padding:24px 16px 60px}.upd-page h1{font-size:22px}}
</style>
</head>
<body>
<div class="upd-page">
  <div class="upd-top">
    <a class="upd-back" href="../english-wonderland/">← 返回儿童英语学园</a>
    <span class="upd-back">English Wonderland</span>
  </div>
  <h1>📜 更新历程</h1>
  <p class="sub">儿童英语学园的每一次更新都在这里留痕 · 持续记录中</p>
  <div class="search-line"><input type="text" id="updSearch" placeholder="搜索更新内容…"></div>
  <div id="updLatest"></div>
  <h3 class="tl-title">全部更新</h3>
  <div class="timeline" id="updTimeline"></div>
</div>
<script src="data.js"></script>
<script>
(function(){
  var data=(window.EW_UPDATES||[]).slice().sort(function(a,b){return a.date<b.date?1:-1;});
  var latestBox=document.getElementById('updLatest');
  var tl=document.getElementById('updTimeline');
  var search=document.getElementById('updSearch');
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function pts(arr){return '<ul>'+(arr||[]).map(function(p){return '<li>'+esc(p)+'</li>';}).join('')+'</ul>';}
  function render(kw){
    kw=(kw||'').trim().toLowerCase();
    var list=data.filter(function(it){
      if(!kw)return true;
      if(it.title.toLowerCase().indexOf(kw)>=0)return true;
      return (it.points||[]).some(function(p){return p.toLowerCase().indexOf(kw)>=0;});
    });
    if(!list.length){latestBox.innerHTML='';tl.innerHTML='<div class="u-empty">没有匹配的更新</div>';return;}
    var first=list[0];
    latestBox.innerHTML='<div class="upd-latest"><div class="u-date">'+esc(first.date)+' · 最新</div><div class="u-title">'+esc(first.title)+'</div>'+pts(first.points)+'</div>';
    var rest=list.slice(1).map(function(it){
      return '<div class="u-node"><div class="u-date">'+esc(it.date)+'</div><div class="u-title">'+esc(it.title)+'</div>'+pts(it.points)+'</div>';
    }).join('');
    tl.innerHTML=rest||'<div class="u-empty">— 以上为全部 —</div>';
  }
  search.addEventListener('input',function(){render(search.value);});
  render('');
})();
</script>
</body>
</html>
