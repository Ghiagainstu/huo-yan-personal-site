<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人工智能训练师 · 判断题练习 v3</title>
<style>
  :root {
    --bg: #f5f6fa; --card: #fff; --primary: #4f46e5; --success: #10b981;
    --danger: #ef4444; --text: #1e293b; --muted: #94a3b8; --border: #e2e8f0;
    --tag-bg: #eef2ff; --tag-text: #4f46e5;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  }
  /* 夜间模式 */
  .dark-mode {
    --bg: #1a1a2e; --card: #16213e; --primary: #7c6cf0; --success: #34d399;
    --danger: #f87171; --text: #e2e8f0; --muted: #94a3b8; --border: #2d3748;
    --tag-bg: #2d2b55; --tag-text: #a5b4fc;
    --shadow: 0 1px 3px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.2);
  }
  .dark-mode .btn-judge.btn-true { background:#1a3a2e; color:#6ee7b7; border-color:#2d5a3e }
  .dark-mode .btn-judge.btn-true:hover:not(:disabled) { background:#2d5a3e }
  .dark-mode .btn-judge.btn-false { background:#3a1a1a; color:#fca5a5; border-color:#5a2d2d }
  .dark-mode .btn-judge.btn-false:hover:not(:disabled) { background:#5a2d2d }
  .dark-mode .progress-bar { background:#2d3748 }
  .dark-mode .nav-btn { background:var(--card); color:var(--text) }
  .dark-mode .history-entry { background:#0f172a }
  .dark-mode .summary-table th { color:var(--muted) }
  .dark-mode .summary-row:hover { background:#0f172a }
  .dark-mode .finish-panel { background:var(--card) }
  .dark-mode select, .dark-mode input { background:#1e293b; color:var(--text); border-color:var(--border) }

  * { margin:0; padding:0; box-sizing:border-box }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
    transition: background .3s, color .3s;
  }
  .container { max-width:720px; margin:0 auto; padding:16px }
  header {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color:#fff; border-radius:14px; padding:20px 24px; margin-bottom:16px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px
  }
  .dark-mode header { background: linear-gradient(135deg, #3b35a0, #5b32b0) }
  header h1 { font-size:18px; font-weight:700 }
  .stats { display:flex; gap:12px; font-size:13px; background:rgba(255,255,255,.15); border-radius:8px; padding:8px 14px }
  .stat-item { text-align:center }
  .stat-item .num { font-size:18px; font-weight:700; display:block }
  .stat-item .label { font-size:11px; opacity:.8 }
  .stat-item .num.correct { color:#a7f3d0 }
  .stat-item .num.wrong { color:#fca5a5 }
  .stat-item .num.remain { color:#fde68a }
  .card {
    background:var(--card); border-radius:14px; padding:24px; box-shadow:var(--shadow);
    transition:border .2s, background .3s; border:2px solid transparent; margin-bottom:16px
  }
  .q-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px }
  .q-num { font-size:12px; color:var(--muted) }
  .q-timer { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums }
  .q-timer.slow { color:#f59e0b; font-weight:600 }
  .q-timer.very-slow { color:var(--danger); font-weight:700 }
  .fav-btn {
    background:none; border:none; cursor:pointer; font-size:20px; padding:2px 6px;
    transition:transform .15s; line-height:1
  }
  .fav-btn:hover { transform:scale(1.2) }
  .fav-btn.active { animation: favPop .3s ease }
  @keyframes favPop { 50% { transform:scale(1.4) } }
  .q-tags { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:10px }
  .q-tag-label {
    display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px;
    background:var(--tag-bg); color:var(--tag-text); font-weight:500
  }
  .q-text { font-size:16px; font-weight:500; margin-bottom:16px; line-height:1.7 }
  .btn-row { display:flex; gap:12px; margin-bottom:16px }
  .btn-judge {
    flex:1; padding:14px; border:none; border-radius:10px;
    font-size:16px; font-weight:600; cursor:pointer;
    transition:all .15s; font-family:inherit
  }
  .btn-judge:active { transform:scale(0.98) }
  .btn-judge:disabled { opacity:.5; cursor:not-allowed; transform:none }
  .btn-judge.btn-true { background:#ecfdf5; color:#065f46; border:2px solid #a7f3d0 }
  .btn-judge.btn-true:hover:not(:disabled) { background:#d1fae5; border-color:#6ee7b7 }
  .btn-judge.btn-true.correct-highlight { background:var(--success); color:#fff; border-color:var(--success) }
  .btn-judge.btn-true.wrong-highlight { background:var(--danger); color:#fff; border-color:var(--danger) }
  .btn-judge.btn-false { background:#fef2f2; color:#991b1b; border:2px solid #fecaca }
  .btn-judge.btn-false:hover:not(:disabled) { background:#fee2e2; border-color:#fca5a5 }
  .btn-judge.btn-false.correct-highlight { background:var(--success); color:#fff; border-color:var(--success) }
  .btn-judge.btn-false.wrong-highlight { background:var(--danger); color:#fff; border-color:var(--danger) }
  .q-result { padding:12px 16px; border-radius:10px; margin-top:14px; display:none; font-size:14px; line-height:1.6 }
  .q-result.show { display:block }
  .q-tag { display:inline-block; padding:2px 10px; border-radius:4px; font-size:12px; font-weight:600; margin:0 2px }
  .q-tag.ans-true { background:#d1fae5; color:#065f46 }
  .q-tag.ans-false { background:#fee2e2; color:#991b1b }
  .nav { display:none; text-align:center; margin:16px 0 24px }
  .nav-inner { display:inline-flex; align-items:center; gap:12px }
  .nav-btn {
    padding:8px 18px; border:1.5px solid var(--border); border-radius:8px;
    background:var(--card); cursor:pointer; font-size:14px; font-weight:500; transition:all .15s
  }
  .nav-btn:hover { border-color:var(--primary); color:var(--primary) }
  .nav-btn:disabled { opacity:.4; cursor:default; border-color:var(--border); color:var(--muted) }
  .nav-pos { font-size:13px; color:var(--muted); min-width:60px }
  .progress-bar { height:6px; background:var(--border); border-radius:3px; margin:12px 0; overflow:hidden }
  .progress-fill { height:100%; background:linear-gradient(90deg, var(--primary), #7c3aed); border-radius:3px; transition:width .3s; width:0 }
  .progress-text { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:12px }
  .toolbar {
    display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px;
    padding:10px 14px; background:var(--card); border-radius:10px; box-shadow:var(--shadow)
  }
  .toolbar select, .toolbar button {
    padding:6px 12px; border-radius:6px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:13px; cursor:pointer;
    transition:all .15s; font-family:inherit
  }
  .toolbar button:hover { border-color:var(--primary); color:var(--primary) }
  .toolbar button.active { background:var(--primary); color:#fff; border-color:var(--primary) }
  .toolbar .mode-btn { font-weight:600 }
  .finish-panel {
    text-align:center; padding:40px 20px; background:var(--card);
    border-radius:14px; box-shadow:var(--shadow)
  }
  .finish-panel .big-icon { font-size:56px; margin-bottom:12px }
  .finish-panel h2 { margin-bottom:8px }
  .finish-panel .score { font-size:48px; font-weight:800; margin:16px 0 4px }
  .finish-panel .detail { color:var(--muted); font-size:14px; margin-bottom:24px }
  .summary-table { width:100%; border-collapse:collapse; font-size:14px; margin-top:12px }
  .summary-table th, .summary-table td { padding:8px 10px; text-align:left; border-bottom:1px solid var(--border) }
  .summary-table th { font-weight:600; color:var(--muted); font-size:12px }
  .summary-row:hover { background:var(--bg) }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px }
  .dot.green { background:var(--success) }
  .dot.red { background:var(--danger) }
  #historyBar { text-align:center; margin:8px 0 16px; display:none; cursor:pointer; color:var(--primary); font-size:13px; font-weight:500 }
  #historyBar:hover { text-decoration:underline }
  .history-entry { background:var(--bg); border-radius:8px; padding:12px; margin-bottom:10px; text-align:left; font-size:13px }
  .toggle-btn { border:none; background:transparent; color:var(--primary); cursor:pointer; font-size:13px; font-weight:500; padding:4px 0 }
  /* 考试模式 */
  .exam-banner {
    background:linear-gradient(135deg, #dc2626, #b91c1c); color:#fff;
    padding:12px 20px; border-radius:10px; margin-bottom:12px;
    display:flex; justify-content:space-between; align-items:center;
    animation: examPulse 2s infinite
  }
  .dark-mode .exam-banner { background:linear-gradient(135deg, #991b1b, #7f1d1d) }
  @keyframes examPulse { 0%,100%{opacity:1} 50%{opacity:.9} }
  .exam-timer { font-size:24px; font-weight:800; font-variant-numeric:tabular-nums }
  .exam-timer.urgent { color:#fde68a; animation: examBlink 1s infinite }
  @keyframes examBlink { 0%,100%{opacity:1} 50%{opacity:.5} }
  /* 间隔重复标记 */
  .spaced-badge {
    display:inline-block; padding:1px 6px; border-radius:3px; font-size:10px;
    background:#fef3c7; color:#92400e; font-weight:600; margin-left:6px
  }
  .dark-mode .spaced-badge { background:#422006; color:#fbbf24 }
  /* 计时统计 */
  .time-stats { margin-top:16px; text-align:left }
  .time-stats h4 { margin-bottom:8px; font-size:14px }
  .time-bar-wrap { margin-bottom:6px }
  .time-bar-label { font-size:12px; color:var(--muted); margin-bottom:2px }
  .time-bar { height:8px; background:var(--border); border-radius:4px; overflow:hidden }
  .time-bar-fill { height:100%; border-radius:4px; transition:width .3s }
</style>

<body>
<div class="container" id="app">
  <header>
    <div>
      <h1>⚖️ 判断题练习</h1>
      <div style="font-size:12px;opacity:.8;margin-top:2px">选择正确或错误</div>
    </div>
    <div class="stats">
      <div class="stat-item"><span class="num correct" id="correctCount">0</span><span class="label">正确</span></div>
      <div class="stat-item"><span class="num wrong" id="wrongCount">0</span><span class="label">错误</span></div>
      <div class="stat-item"><span class="num remain" id="remainCount">300</span><span class="label">剩余</span></div>
      <div class="stat-item"><span class="num" id="scorePercent" style="color:#fff">-</span><span class="label">正确率</span></div>
    </div>
  </header>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <span style="font-size:12px;color:var(--muted)" id="roundBadge">第 1 轮</span>
    <div style="display:flex;gap:8px;align-items:center">
      <button onclick="toggleDarkMode()" id="darkModeBtn" style="font-size:16px;padding:2px 8px;border:none;background:none;cursor:pointer" title="夜间模式">🌙</button>
      <button onclick="if(confirm('确定要重置所有进度吗？'))resetAll()" style="font-size:12px;padding:4px 14px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--danger);cursor:pointer">🔄 重置进度</button>
    </div>
  </div>

  <!-- 工具栏：模式切换 + 标签筛选 + 收藏 -->
  <div class="toolbar" id="toolbar">
    <button class="mode-btn active" id="modePractice" onclick="switchMode('practice')">📝 练习</button>
    <button class="mode-btn" id="modeExam" onclick="switchMode('exam')">🎓 考试</button>
    <button id="modeFav" onclick="switchMode('fav')" title="刷收藏题">⭐ 收藏<span id="favCount">0</span></button>
    <button id="modeSpaced" onclick="switchMode('spaced')" title="间隔重复：到期需复习的错题">🔁 复习<span id="spacedCount">0</span></button>
    <select id="tagFilter" onchange="applyTagFilter()" style="min-width:100px">
      <option value="">全部知识点</option>
    </select>
  </div>

  <div class="progress-text">
    <span id="progressCur">0 / 0</span>
    <span id="progressPct">0%</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div id="examBanner" style="display:none"></div>

  <div id="historyBar" onclick="toggleHistory()">📊 查看各轮错题回顾（<span id="historyCount">0</span>轮）</div>

  <div id="questionArea"></div>

  <div class="nav" id="qNav">
    <div class="nav-inner">
      <button class="nav-btn" id="prevBtn" onclick="goToQuestion(currentIndex-1)">◀ 上一题</button>
      <span class="nav-pos" id="navPos"></span>
      <button class="nav-btn" id="nextBtn" onclick="goToQuestion(currentIndex+1)">下一题 ▶</button>
    </div>
  </div>
</div>

数据标注与处理"]},{"id":120,"text":"数据预处理通常包括转换原始数据为一种更适合机器学习模型处理的格式。","answer":true,"tags":["数据标注与处理","模型与算法"]},{"id":121,"text":"线性回归是一种用于解决分类问题的方法。","answer":false,"tags":["综合"]},{"id":122,"text":"模型训练和验证工具的原理是通过不断调整模型的参数来最小化损失函数，从而提高模型的预测准确性。","answer":true,"tags":["模型与算法","质量与评估"]},{"id":123,"text":"所有的自动化模型训练工具都使用相同的超参数优化策略。","answer":false,"tags":["模型与算法"]},{"id":124,"text":"日志分析工具仅用于记录系统的错误信息。","answer":false,"tags":["综合"]},{"id":125,"text":"生成对抗网络中的生成器和判别器是同步训练的。","answer":true,"tags":["模型与算法"]},{"id":126,"text":"人工智能训练师使用Python或R进行智能训练数据处理时，主要依赖于这些编程语言提供的数据处理和机器学习库，以及其支持的数据可视化和预处理方法。","answer":true,"tags":["数据标注与处理","模型与算法","AI基础概念","训练师职业"]},{"id":127,"text":"模型部署工具的原理是将训练好的模型转换为可执行程序，以便在实际应用中使用。","answer":true,"tags":["模型与算法"]},{"id":128,"text":"数据探索分析是指对数据进行收集、整理、清洗和转换的过程。","answer":false,"tags":["数据标注与处理"]},{"id":129,"text":"数据探索分析旨在通过初步的图表、图形和统计方法来了解和发现数据的基本特征和结构。","answer":true,"tags":["综合"]},{"id":130,"text":"缺失值处理方法中的删除法是指直接删除含有缺失值的记录。","answer":false,"tags":["综合"]},{"id":131,"text":"当数据集中存在缺失值时，我们应该直接删除这些数据点。","answer":false,"tags":["综合"]},{"id":132,"text":"在Python 中，使用箱型图法检测异常值时，任何位于箱型图外的点都应被视为异常值并从数据集中删除。","answer":false,"tags":["综合"]},{"id":133,"text":"异常值检测的原理完全基于统计学方法，与数据的业务逻辑无关。","answer":false,"tags":["综合"]},{"id":134,"text":"噪声数据处理技术只能用于消除图像中的噪声。","answer":false,"tags":["综合"]},{"id":135,"text":"数据去重技术主要是通过哈希表来实现的。","answer":false,"tags":["综合"]},{"id":136,"text":"数据归一化处理的目的是为了改变数据的类型，使其能够适配不同的机器学习算法。","answer":false,"tags":["模型与算法"]},{"id":137,"text":"数据白化处理通常是指一种特殊的归一化技术，它不仅缩放数据使其具有单位方差，还使数据特征之间相互独立，数据白化处理常用于图像处理、语音信号处理和机器学习领域。","answer":true,"tags":["模型与算法"]},{"id":138,"text":"特征工程是指从原始数据中提取、转换和构建有助于提高模型性能的特征的过程。","answer":true,"tags":["模型与算法"]},{"id":139,"text":"在选择数据标注工具时，应该首先考虑工具的价格，而不是它支持的标注类型或与现有工作流的集成性。","answer":false,"tags":["数据标注与处理"]},{"id":140,"text":"数据标注技术主要依赖于人工进行标注，因此成本较高。","answer":true,"tags":["数据标注与处理"]},{"id":141,"text":"在机器学习项目中，训练集、验证集和测试集的划分并不是一成不变的。","answer":true,"tags":["模型与算法","质量与评估"]},{"id":142,"text":"自动化标注的主要优势在于减少了人为错误，但并不包括提高效率和降低成本。","answer":false,"tags":["数据标注与处理"]},{"id":143,"text":"分布式数据处理是指在多台计算机上并行处理数据的技术。","answer":true,"tags":["综合"]},{"id":144,"text":"数据可追溯性是指在数据处理和分析过程中，能够追踪数据的来源、流动路径以及数据在各个阶段所经历的处理和转换的能力。","answer":true,"tags":["综合"]},{"id":145,"text":"数据可追溯性确保了数据的完整性、透明度和责任性，对于数据的质量和可信度至关重要。","answer":true,"tags":["质量与评估"]},{"id":146,"text":"表格类数据的数据清洗和标注的第一步是对数据进行预处理，包括去除重复值、缺失值处理和异常值处理。","answer":true,"tags":["数据标注与处理"]},{"id":147,"text":"在Python 中，可以使用Pillow库读取、保存或显示图像。","answer":true,"tags":["综合"]},{"id":148,"text":"在进行文本类数据清洗和标注时，规则与流程是固定不变的，适用于所有类型的文本数据。","answer":false,"tags":["数据标注与处理"]},{"id":149,"text":"对图像或视频数据进行精确的标记和注释，以提供机器学习模型训练所需的信息。标注类型可能包括边界框、多边形、语义分割等。","answer":true,"tags":["数据标注与处理","模型与算法"]},{"id":150,"text":"算法训练的基本流程通常包括这些步骤：数据预处理、数据分割、选择模型、模型训练、模型评估和模型优化。","answer":true,"tags":["数据标注与处理","模型与算法","质量与评估"]},{"id":151,"text":"数据集划分的原则是将数据集按照一定比例随机划分为训练集、验证集和测试集。","answer":true,"tags":["模型与算法","质量与评估"]},{"id":152,"text":"使用Pandas库可以方便地加载和处理CSV、Excel和SQL等格式的数据。","answer":true,"tags":["综合"]},{"id":153,"text":"降维技术可以将高维数据集映射到低维空间，同时保留数据的主要信息。","answer":true,"tags":["综合"]},{"id":154,"text":"使用数据标注和注释工具时，标注结果需要人工审核以确保准确性。","answer":true,"tags":["数据标注与处理"]},{"id":155,"text":"在模型训练过程中，训练数据集越大，模型训练出的准确率一定会越高。","answer":false,"tags":["模型与算法","质量与评估"]},{"id":156,"text":"损失函数的选择和优化算法的选取都需要根据具体的模型和任务来决定，它们共同决定了模型训练的效果和最终性能。","answer":true,"tags":["模型与算法"]},{"id":157,"text":"搭建算法训练环境时，只需要考虑计算硬件的性能，而无需考虑软件依赖和版本兼容性。","answer":false,"tags":["模型与算法"]},{"id":158,"text":"机器学习框架的选择与使用主要取决于开发者的个人喜好。","answer":false,"tags":["模型与算法"]},{"id":159,"text":"评估算法的效率，包括时间复杂度和空间复杂度分析，确保算法能够在可接受的时间内完成计算，并且资源消耗在合理范围内。","answer":true,"tags":["模型与算法","质量与评估"]},{"id":160,"text":"超参数调优的策略只有随机搜索。","answer":false,"tags":["综合"]},{"id":161,"text":"动态监控工具通常能够实时显示模型训练过程中的多种指标，包括但不限于损失函数值、准确率、验证集上的表现等。这些指标对于评估模型的训练效果和调整训练策略至关重要。","answer":true,"tags":["模型与算法","质量与评估"]},{"id":162,"text":"在模型调试过程中，可以通过观察训练集和验证集的损失函数值来判断模型是否过拟合或欠拟合。","answer":true,"tags":["模型与算法","质量与评估"]},{"id":163,"text":"算法测试的评价指标主要包括时间复杂度和空间复杂度。","answer":false,"tags":["模型与算法","质量与评估"]},{"id":164,"text":"在将机器学习模型部署到生产环境时，模型部署只需要将训练好的模型文件上传到服务器，无需其他步骤。","answer":false,"tags":["模型与算法"]},{"id":165,"text":"TensorFlow Lite 是一个用于在移动设备上部署机器学习模型的框架。","answer":false,"tags":["模型与算法"]},{"id":166,"text":"使用云平台可以降低企业的运营成本。","answer":true,"tags":["综合"]},{"id":167,"text":"容器化技术是一种将应用程序及其依赖项打包在一起的方法，以便在不同的环境中轻松部署和运行。","answer":true,"tags":["综合"]},{"id":168,"text":"容器化技术与虚拟机技术相比，容器化技术提供了更彻底的操作系统级隔离，因为每个容器都运行在自己的操作系统内核上。","answer":false,"tags":["综合"]},{"id":169,"text":"在人工智能项目中，选择数据处理框架时，框架的易用性和灵活性比其性能和扩展性更加重要。","answer":false,"tags":["AI基础概念"]},{"id":170,"text":"在高性能计算HPC环境中，为了最大化资源利用率，应该始终将所有计算节点配置为相同的任务类型，以保持操作的一致性。","answer":false,"tags":["综合"]},{"id":171,"text":"性能监控工具可以自动发现系统中的瓶颈和问题，无需人工干预。","answer":false,"tags":["综合"]},{"id":172,"text":"在设计人工智能系统的测试用例时，确保测试用例的全面性比确保它们的执行效率更重要。","answer":false,"tags":["AI基础概念","质量与评估"]},{"id":173,"text":"人工智能测试的目的在一定程度上可以识别并解决模型可能存在的偏差，确保AI系统的决策过程是公正和无歧视的。","answer":true,"tags":["模型与算法","AI基础概念","质量与评估"]},{"id":174,"text":"人工智能测试工具的类型只包括黑盒测试。","answer":false,"tags":["AI基础概念","质量与评估"]},{"id":175,"text":"在选择测试框架时，唯一需要考虑的因素是该框架是否支持自动化测试。","answer":false,"tags":["质量与评估"]},{"id":176,"text":"在人工智能项目的测试过程中，自动化测试可以完全取代手动测试，因为自动化测试可以覆盖所有的测试场景。","answer":false,"tags":["AI基础概念","质量与评估"]},{"id":177,"text":"算法性能指标的监控可以帮助我们了解算法的实际运行情况，从而优化算法设计。","answer":true,"tags":["模型与算法"]},{"id":178,"text":"交叉验证是一种强大的统计技术，可以用来确保模型评估结果的稳定性和可靠性，特别是在数据量有限的情况下。","answer":true,"tags":["模型与算法","质量与评估"]},{"id":179,"text":"算法鲁棒性测试只关注算法在面对特定类型的数据异常时的表现。","answer":false,"tags":["模型与算法","质量与评估"]},{"id":180,"text":"算法安全性测试的结果可以用来指导算法的改进和优化。","answer":true,"tags":["模型与算法","质量与评估"]},{"id":181,"text":"算法可解释性与透明度测试是确保人工智能系统决策过程能够被用户、开发者和监管机构理解和信任的重要方面。","answer":true,"tags":["模型与算法","AI基础概念","质量与评估"]},{"id":182,"text":"在进行数据多样性与公平性测试时，我们只需要关注数据集中是否存在偏见即可。","answer":false,"tags":["质量与评估"]},{"id":183,"text":"k折交叉验证是一种评价训练数据的数据集泛化能力的统计方法，通过对数据集进行多次划分，对多次评估的结果取平均，从而消除单次划分时数据划分不平衡造成的不良影响。","answer":true,"tags":["模型与算法","质量与评估"]},{"id":184,"text":"收集和分析算法在生产环境中的性能数据是重要的，这有助于了解算法的实际表现，并进行必要的优化。","answer":true,"tags":["模型与算法"]},{"id":185,"text":"用户反馈集成可以帮助开发团队更好地理解用户需求，从而提高人工智能系统的满意度。","answer":true,"tags":["AI基础概念"]},{"id":186,"text":"在进行算法测试结果的统计分析时，我们应该只关注正例的测试结果。","answer":false,"tags":["模型与算法","质量与评估"]},{"id":187,"text":"测试报告是一份重要的文档，它不仅记录了测试结果，还应该详细说明测试的方法、测试环境、测试用例、测试数据和测试过程中遇到的问题及解决方案。","answer":true,"tags":["质量与评估"]},{"id":188,"text":"在人工智能算法开发过程中，进行调试与问题定位时，在发现问题后立即重写整个算法，而不是逐步定位和修复问题。","answer":false,"tags":["模型与算法","AI基础概念"]},{"id":189,"text":"在人工智能算法的开发和测试中，通过可视化，可以更直观地识别数据中的模式、异常值、偏差和噪声，同时也能够更清楚地展示算法性能的变化趋势和潜在问题。","answer":true,"tags":["模型与算法","AI基础概念","质量与评估"]},{"id":190,"text":"日志分析工具通常需要具备实时处理能力，以便快速响应潜在的安全威胁。","answer":true,"tags":["综合"]},{"id":191,"text":"在进行算法测试实验管理时，使用统一的测试管理平台可以提高测试效率，但无法帮助追踪和管理测试过程中的复杂依赖关系。","answer":false,"tags":["模型与算法","质量与评估"]},{"id":192,"text":"在人工智能项目中，修复与迭代是一个持续的过程，通常不是简单地按部就班解决所有缺陷后再进行测试和迭代。","answer":true,"tags":["AI基础概念","质量与评估"]},{"id":193,"text":"合规性测试只需要验证软件产品是否符合行业标准和法律法规，而不需要考虑产品的实际功能和性能。","answer":false,"tags":["法律法规","质量与评估"]},{"id":194,"text":"利用并行计算和分布式系统可以显著提高算法的运行效率，尤其是对于那些可以分解为多个独立且可以并行处理的任务的算法。","answer":true,"tags":["模型与算法"]},{"id":195,"text":"在进行伦理考量时，我们只需要关注自己的利益，而不需要考虑他人的利益。","answer":false,"tags":["职业道德与伦理"]},{"id":196,"text":"在人工智能算法训练中，数据拆解的基本方法包括随机拆分和分层拆分。","answer":true,"tags":["模型与算法","AI基础概念"]},{"id":197,"text":"数据拆解模型的原理是将原始数据按照一定的规则进行拆分和重组，以便更好地理解和分析数据。","answer":true,"tags":["模型与算法"]},{"id":198,"text":"训练集、验证集和测试集的作用都是为了评估模型的性能。","answer":false,"tags":["模型与算法","质量与评估"]},{"id":199,"text":"主成分分析是一种基于数据拆解的特征降维方法。","answer":true,"tags":["综合"]},{"id":200,"text":"基于统计的特征拆解及选择是一种常用的机器学习特征处理方法。","answer":true,"tags":["模型与算法"]},{"id":201,"text":"在基于模型的特征选择中，递归特征消除RFE是一种包装器方法，它通过反复构建模型来选择特征子集。","answer":true,"tags":["模型与算法"]},{"id":202,"text":"时间序列数据分割时，通常不需要保持数据的连续性和时序性，可以直接随机分割。","answer":false,"tags":["综合"]},{"id":203,"text":"在文本数据处理中，分词是所有语言的必要步骤。","answer":true,"tags":["综合"]},{"id":204,"text":"时间 综合"]},{"id":229,"text":"主成分分析PCA是一种常用的维度约简技术，其基本思想是通过降低数据维度来减少信息损失。","answer":true,"tags":["综合"]},{"id":230,"text":"异常值检测与处理是一种用于识别数据集中异常点的方法。","answer":true,"tags":["综合"]},{"id":231,"text":"数据融合技术主要用于将多源异构数据集成为一个统一的数据源。","answer":true,"tags":["综合"]},{"id":232,"text":"智能解决方案设计旨在结合人工智能技术与特定领域需求，提供全面的解决方案。","answer":true,"tags":["AI基础概念"]},{"id":233,"text":"用户需求分析是指识别和理解用户对产品或服务的需求和期望，以便设计出符合其预期的解决方案。","answer":true,"tags":["综合"]},{"id":234,"text":"产品功能规划是对产品功能的全面、系统、科学的规划，它具有全局性、前瞻性和创新性。","answer":true,"tags":["综合"]},{"id":235,"text":"人工智能技术选型的原则包括选择最新的技术，以保持竞争优势。","answer":false,"tags":["AI基础概念"]},{"id":236,"text":"模型训练与验证的方法只有交叉验证一种。","answer":false,"tags":["模型与算法","质量与评估"]},{"id":237,"text":"系统集成设计的规则主要包括尽量减少模块之间的依赖关系，以提高系统的灵活性。","answer":true,"tags":["综合"]},{"id":238,"text":"用户界面设计UI不需要考虑性能优化。","answer":false,"tags":["综合"]},{"id":239,"text":"用户体验设计UX的原则强调在设计过程中始终关注用户的需求和体验。","answer":true,"tags":["综合"]},{"id":240,"text":"产品差异化设计旨在使产品在竞争激烈的市场中脱颖而出，吸引更多的用户。","answer":true,"tags":["综合"]},{"id":241,"text":"在设计软件时，不需要考虑安全性问题。","answer":false,"tags":["综合"]},{"id":242,"text":"在云服务集成中，关键策略之一是选择合适的云服务提供商以满足业务需求。","answer":true,"tags":["综合"]},{"id":243,"text":"性能优化技术的原理是通过减少程序中的冗余代码来提高程序的运行速度。","answer":false,"tags":["综合"]},{"id":244,"text":"可扩展性设计旨在确保系统能够在不断增长的需求下保持高性能。","answer":true,"tags":["综合"]},{"id":245,"text":"代码审计主要关注代码的编写规范性，对系统性能影响不大。","answer":false,"tags":["法律法规"]},{"id":246,"text":"企业在收集、存储和处理用户数据时，不需要告知用户数据的用途和收集方式。","answer":false,"tags":["综合"]},{"id":247,"text":"故障恢复策略的设计不包括备份和恢复机制。","answer":false,"tags":["综合"]},{"id":248,"text":"产品维护与升级制定的关键是定期发布新版本以保持用户的兴趣。","answer":false,"tags":["综合"]},{"id":249,"text":"在用户反馈与迭代过程的管理中，应该忽略所有负面反馈。","answer":false,"tags":["综合"]},{"id":250,"text":"人机交互是指人与计算机之间的信息交流和操作过程。","answer":true,"tags":["综合"]},{"id":251,"text":"人机交互三要素包括输入设备、输出设备和控制器。","answer":false,"tags":["综合"]},{"id":252,"text":"人机交互模型描述了人和计算机之间信息传递的过程，通常包括输入、处理、输出和反馈等环节。","answer":true,"tags":["模型与算法"]},{"id":253,"text":"在用户界面设计中，应该遵循一致性原则，即相同类型的元素应该有相同的操作和外 var TAG_COUNTS = {'职业道德与伦理': 5, '法律法规': 14, '数据安全与隐私': 3, '模型与算法': 74, 'AI基础概念': 32, '训练师职业': 12, '质量与评估': 45, '综合': 164, '数据标注与处理': 28};
var EXAM_TIME = 5400; // 90分钟

var allQuestions = QDATA;
var currentPool = [];
var currentIndex = 0;
var submitted = false;
var selectedAnswer = null;
var roundNumber = 1;
var roundResults = [];
var resumedMidRound = false;
var autoAdvancing = false;
var globalWrongIds = null;
var snapshotPreRoundWrongIds = null;
var snapshotPreRoundNumber = 1;
var roundHistory = [];
var reviewingRound = 0;

// 收藏
var favorites = new Set();
// 标签筛选
var currentTag = '';
// 模式: practice / exam / fav / spaced
var currentMode = 'practice';
// 考试模式
var examTimer = null;
var examTimeLeft = 0;
var examAnswers = {};
var examSubmitted = false;
// 答题计时
var questionStartTime = 0;
var questionTimes = {}; // id -> seconds
var timerInterval = null;
// 间隔重复: id -> { nextDate: 'YYYY-MM-DD', interval: 1|3|7 }
var spacedRepetition = {};
// 夜间模式
var darkMode = false;

// ===== 初始化 =====
function init() {
  var ver = localStorage.getItem('ai_trainer_judge_version');
  if (ver !== '3') { clearStorage(); localStorage.setItem('ai_trainer_judge_version', '3'); }
  loadFromStorage();
  initTagFilter();
  updateFavCount();
  updateSpacedCount();
  // 夜间模式
  if (darkMode) document.body.classList.add('dark-mode');
  if (darkMode) document.getElementById('darkModeBtn').textContent = '☀️';

  var savedFinish = localStorage.getItem('ai_trainer_finish_judge');
  if (savedFinish) {
    try {
      var data = JSON.parse(savedFinish);
      snapshotPreRoundWrongIds = globalWrongIds ? new Set(globalWrongIds) : null;
      snapshotPreRoundNumber = data.roundNumber;
      renderFinishPanel(data);
      return;
    } catch(e) {}
  }
  if (currentPool.length > 0 && roundResults.length > 0) { resumedMidRound = true; }
  startNewRound();
}

function loadFromStorage() {
  try {
    var raw = localStorage.getItem('ai_trainer_wrong_ids_judge');
    if (raw) globalWrongIds = new Set(JSON.parse(raw));
    var r = localStorage.getItem('ai_trainer_round_judge');
    if (r) roundNumber = parseInt(r) || 1;
    var poolOrder = localStorage.getItem('ai_trainer_pool_order_judge');
    var results = localStorage.getItem('ai_trainer_round_results_judge');
    var idx = localStorage.getItem('ai_trainer_current_index_judge');
    if (poolOrder) {
      var orderIds = JSON.parse(poolOrder);
      currentPool = orderIds.map(function(id) { return allQuestions.find(function(q) { return q.id === id; }); }).filter(Boolean);
    }
    if (results) roundResults = JSON.parse(results);
    if (idx !== null) currentIndex = parseInt(idx) || 0;
    var rh = localStorage.getItem('ai_trainer_round_history_judge');
    if (rh) roundHistory = JSON.parse(rh);
    // 收藏
    var fav = localStorage.getItem('ai_trainer_favs_judge');
    if (fav) favorites = new Set(JSON.parse(fav));
    // 间隔重复
    var sr = localStorage.getItem('ai_trainer_spaced_judge');
    if (sr) spacedRepetition = JSON.parse(sr);
    // 答题计时
    var qt = localStorage.getItem('ai_trainer_times_judge');
    if (qt) questionTimes = JSON.parse(qt);
    // 夜间模式
    var dm = localStorage.getItem('ai_trainer_dark_judge');
    if (dm === '1') darkMode = true;
  } catch(e) { currentPool = []; roundResults = []; currentIndex = 0; }
}

function saveProgress() {
  saveToStorage();
  try {
    localStorage.setItem('ai_trainer_pool_order_judge', JSON.stringify(currentPool.map(function(q) { return q.id; })));
    localStorage.setItem('ai_trainer_round_results_judge', JSON.stringify(roundResults));
    localStorage.setItem('ai_trainer_current_index_judge', currentIndex);
  } catch(e) {}
}

function clearCurrentProgress() {
  localStorage.removeItem('ai_trainer_pool_order_judge');
  localStorage.removeItem('ai_trainer_round_results_judge');
  localStorage.removeItem('ai_trainer_current_index_judge');
}

function saveToStorage() {
  if (globalWrongIds && globalWrongIds.size > 0) {
    localStorage.setItem('ai_trainer_wrong_ids_judge', JSON.stringify(Array.from(globalWrongIds)));
  } else { localStorage.removeItem('ai_trainer_wrong_ids_judge'); }
  localStorage.setItem('ai_trainer_round_judge', roundNumber);
  if (roundHistory.length > 0) localStorage.setItem('ai_trainer_round_history_judge', JSON.stringify(roundHistory));
  // 收藏
  localStorage.setItem('ai_trainer_favs_judge', JSON.stringify(Array.from(favorites)));
  // 间隔重复
  localStorage.setItem('ai_trainer_spaced_judge', JSON.stringify(spacedRepetition));
  // 计时
  localStorage.setItem('ai_trainer_times_judge', JSON.stringify(questionTimes));
  // 夜间
  localStorage.setItem('ai_trainer_dark_judge', darkMode ? '1' : '0');
}

function clearStorage() {
  var keys = ['wrong_ids','round','pool_order','round_results','current_index','finish','round_history','favs','spaced','times','dark'];
  keys.forEach(function(k) { localStorage.removeItem('ai_trainer_' + k + '_judge'); });
  roundHistory = []; favorites = new Set(); spacedRepetition = {}; questionTimes = {};
}

// ===== 标签筛选 =====
function initTagFilter() {
  var sel = document.getElementById('tagFilter');
  if (!sel) return;
  sel.innerHTML = '<option value="">全部知识点</option>';
  Object.keys(TAG_COUNTS).sort().forEach(function(tag) {
    var opt = document.createElement('option');
    opt.value = tag; opt.textContent = tag + '（' + TAG_COUNTS[tag] + '题）';
    sel.appendChild(opt);
  });
}

function applyTagFilter() {
  currentTag = document.getElementById('tagFilter').value;
  if (currentMode === 'practice' || currentMode === 'fav' || currentMode === 'spaced') {
    startNewRound();
  }
}

// ===== 模式切换 =====
function switchMode(mode) {
  if (mode === 'exam') { startExam(); return; }
  currentMode = mode;
  stopExamTimer();
  // 更新按钮状态
  document.getElementById('modePractice').classList.toggle('active', mode === 'practice');
  document.getElementById('modeExam').classList.toggle('active', mode === 'exam');
  document.getElementById('modeFav').classList.toggle('active', mode === 'fav');
  document.getElementById('modeSpaced').classList.toggle('active', mode === 'spaced');
  document.getElementById('examBanner').style.display = 'none';
  reviewingRound = 0; resumedMidRound = false;
  clearCurrentProgress();
  localStorage.removeItem('ai_trainer_finish_judge');
  startNewRound();
  window.scrollTo({ top:0, behavior:'smooth' });
}

// ===== 夜间模式 =====
function toggleDarkMode() {
  darkMode = !darkMode;
  document.body.classList.toggle('dark-mode', darkMode);
  document.getElementById('darkModeBtn').textContent = darkMode ? '☀️' : '🌙';
  saveToStorage();
}

// ===== 收藏 =====
function toggleFavorite(id) {
  if (favorites.has(id)) { favorites.delete(id); }
  else { favorites.add(id); }
  saveToStorage(); updateFavCount();
  // 更新按钮
  var btn = document.getElementById('favBtn');
  if (btn) btn.textContent = favorites.has(id) ? '⭐' : '☆';
}

function updateFavCount() {
  var el = document.getElementById('favCount');
  if (el) el.textContent = favorites.size > 0 ? '(' + favorites.size + ')' : '';
}

// ===== 间隔重复 =====
function getToday() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function addSpacedRepetition(id, correct) {
  if (correct) {
    // 答对：推进间隔
    var cur = spacedRepetition[id] || { nextDate: getToday(), interval: 1 };
    var nextInterval = cur.interval === 1 ? 3 : cur.interval === 3 ? 7 : 30;
    var next = new Date();
    next.setDate(next.getDate() + nextInterval);
    spacedRepetition[id] = { nextDate: next.getFullYear() + '-' + String(next.getMonth()+1).padStart(2,'0') + '-' + String(next.getDate()).padStart(2,'0'), interval: nextInterval };
  } else {
    // 答错：重置间隔
    spacedRepetition[id] = { nextDate: getToday(), interval: 1 };
  }
  saveToStorage();
}

function getSpacedDueIds() {
  var today = getToday();
  var due = [];
  for (var id in spacedRepetition) {
    if (spacedRepetition[id].nextDate <= today) due.push(parseInt(id));
  }
  return due;
}

function updateSpacedCount() {
  var el = document.getElementById('spacedCount');
  var count = getSpacedDueIds().length;
  if (el) el.textContent = count > 0 ? '(' + count + ')' : '';
}

// ===== 答题计时 =====
function startQuestionTimer() {
  questionStartTime = Date.now();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(function() {
    var elapsed = Math.round((Date.now() - questionStartTime) / 1000);
    var el = document.getElementById('qTimer');
    if (el) {
      var m = Math.floor(elapsed / 60);
      var s = elapsed % 60;
      el.textContent = (m > 0 ? m + ':' : '') + (m > 0 ? String(s).padStart(2,'0') : s + 's');
      el.className = 'q-timer' + (elapsed > 30 ? ' very-slow' : elapsed > 15 ? ' slow' : '');
    }
  }, 1000);
}

function stopQuestionTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function recordQuestionTime(id) {
  var elapsed = Math.round((Date.now() - questionStartTime) / 1000);
  questionTimes[id] = (questionTimes[id] || 0) + elapsed;
  saveToStorage();
}

// ===== 考试模式 =====
function startExam() {
  currentMode = 'exam';
  examSubmitted = false;
  examAnswers = {};
  examTimeLeft = EXAM_TIME;
  document.getElementById('modePractice').classList.remove('active');
  document.getElementById('modeExam').classList.add('active');
  document.getElementById('modeFav').classList.remove('active');
  document.getElementById('modeSpaced').classList.remove('active');
  reviewingRound = 0; resumedMidRound = false;
  clearCurrentProgress();
  localStorage.removeItem('ai_trainer_finish_judge');

  // 打乱所有题目
  currentPool = allQuestions.slice();
  shuffle(currentPool);
  currentIndex = 0; roundResults = []; submitted = false; selectedAnswer = null;

  renderExamBanner();
  document.getElementById('examBanner').style.display = 'flex';
  document.getElementById('toolbar').style.display = 'none';
  updateRoundUI();
  renderExamQuestion();
  startExamTimer();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function renderExamBanner() {
  var banner = document.getElementById('examBanner');
  if (!banner) return;
  var m = Math.floor(examTimeLeft / 60);
  var s = examTimeLeft % 60;
  var urgent = examTimeLeft <= 300;
  banner.innerHTML = '<div><b>🎓 考试模式</b><span style="font-size:12px;opacity:.8;margin-left:8px">' + currentPool.length + ' 题</span></div>'
    + '<div style="display:flex;align-items:center;gap:12px"><span class="exam-timer' + (urgent ? ' urgent' : '') + '">' + m + ':' + String(s).padStart(2,'0') + '</span>'
    + '<button onclick="submitExam()" style="padding:6px 16px;border-radius:6px;border:none;background:#fff;color:#dc2626;font-weight:600;cursor:pointer;font-size:13px">交卷</button></div>';
}

function startExamTimer() {
  if (examTimer) clearInterval(examTimer);
  examTimer = setInterval(function() {
    examTimeLeft--;
    renderExamBanner();
    if (examTimeLeft <= 0) { stopExamTimer(); submitExam(); }
  }, 1000);
}

function stopExamTimer() {
  if (examTimer) { clearInterval(examTimer); examTimer = null; }
}

function renderExamQuestion() {
  if (currentIndex >= currentPool.length) { submitExam(); return; }
  var q = currentPool[currentIndex];
  var answered = examAnswers.hasOwnProperty(q.id);
  var area = document.getElementById('questionArea');

  var btnTrueClass = 'btn-judge btn-true';
  var btnFalseClass = 'btn-judge btn-false';
  var resultHtml = '';

  if (answered) {
    btnTrueClass += ' disabled-style'; btnFalseClass += ' disabled-style';
    // 考试中不显示对错，只显示已选
    if (examAnswers[q.id] === true) btnTrueClass += ' selected';
    else btnFalseClass += ' selected';
    resultHtml = '<div class="q-result show" style="background:var(--tag-bg);color:var(--tag-text)">已作答</div>';
  }

  area.innerHTML = '<div class="card">'
    + '<div class="q-header"><div class="q-num">第 ' + q.id + ' 题</div><div class="q-timer" id="qTimer"></div></div>'
    + '<div class="q-tags">' + (q.tags||[]).map(function(t){return '<span class="q-tag-label">'+t+'</span>';}).join('') + '</div>'
    + '<div class="q-text">' + escapeHtml(q.text) + '</div>'
    + '<div class="btn-row">'
    + '<button class="' + btnTrueClass + '" onclick="examChoose(' + q.id + ',true)"' + (answered?' disabled':'') + '>✅ 正确</button>'
    + '<button class="' + btnFalseClass + '" onclick="examChoose(' + q.id + ',false)"' + (answered?' disabled':'') + '>❌ 错误</button>'
    + '</div>'
    + resultHtml + '</div>';

  updateProgress(); renderNav();
  startQuestionTimer();
}

function examChoose(id, ans) {
  if (examAnswers.hasOwnProperty(id)) return;
  examAnswers[id] = ans;
  recordQuestionTime(id);
  // 自动跳下一题
  autoAdvancing = true;
  setTimeout(function() {
    autoAdvancing = false;
    if (currentIndex >= currentPool.length - 1) { /* 最后一题，不自动交卷 */ renderExamQuestion(); }
    else { currentIndex++; renderExamQuestion(); window.scrollTo({ top:0, behavior:'smooth' }); }
  }, 200);
}

function submitExam() {
  stopExamTimer();
  examSubmitted = true;
  document.getElementById('examBanner').style.display = 'none';
  document.getElementById('toolbar').style.display = 'flex';

  // 批改
  var correct = 0, wrong = 0, unanswered = 0;
  var wrongItems = [];
  currentPool.forEach(function(q) {
    if (!examAnswers.hasOwnProperty(q.id)) { unanswered++; return; }
    var isCorrect = examAnswers[q.id] === q.answer;
    if (isCorrect) correct++;
    else { wrong++; wrongItems.push({ id: q.id, text: q.text.substring(0,50)+(q.text.length>50?'...':''), userAnswer: examAnswers[q.id], correctAnswer: q.answer }); }
  });

  // 记录到 roundHistory
  var total = currentPool.length;
  var pct = total > 0 ? Math.round(correct / total * 100) : 0;
  roundHistory.push({ round: roundNumber, correct: correct, wrong: wrong, pct: pct, wrongIds: wrongItems.map(function(w){return w.id;}), exam: true });
  globalWrongIds = new Set();
  for (var gi = 0; gi < roundHistory.length; gi++) {
    for (var gj = 0; gj < roundHistory[gi].wrongIds.length; gj++) { globalWrongIds.add(roundHistory[gi].wrongIds[gj]); }
  }
  // 间隔重复
  wrongItems.forEach(function(w) { addSpacedRepetition(w.id, false); });
  currentPool.forEach(function(q) { if (examAnswers[q.id] === q.answer) addSpacedRepetition(q.id, true); });
  saveToStorage();
  updateSpacedCount();

  // 渲染考试结果
  var area = document.getElementById('questionArea');
  var wrongListHtml = '';
  if (wrongItems.length > 0) {
    wrongListHtml = '<div style="text-align:left;margin-top:20px"><h4 style="margin-bottom:10px">📋 错题详情：</h4><table class="summary-table"><thead><tr><th>题号</th><th>题目</th><th>你的答案</th><th>正确答案</th></tr></thead><tbody>'
      + wrongItems.map(function(w) {
        return '<tr class="summary-row"><td><span class="dot red"></span>' + w.id + '</td><td>' + escapeHtml(w.text) + '</td><td>' + (w.userAnswer?'正确':'错误') + '</td><td>' + (w.correctAnswer?'正确':'错误') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  // 计时统计
  var timeStatsHtml = buildTimeStats(currentPool);

  var emoji = pct === 100 ? '🎉' : pct >= 80 ? '😊' : pct >= 60 ? '💪' : '📚';
  var msg = pct === 100 ? '太棒了！' : pct >= 80 ? '不错！' : pct >= 60 ? '继续加油！' : '多加练习！';

  area.innerHTML = '<div class="finish-panel"><div class="big-icon">' + emoji + '</div><h2>🎓 考试结束</h2><div class="score">' + pct + '%</div>'
    + '<p class="detail">' + correct + ' 正确 / ' + wrong + ' 错误 / ' + unanswered + ' 未答（共' + total + '题）</p>'
    + '<p style="color:var(--muted);font-size:14px">' + msg + '</p>'
    + wrongListHtml + timeStatsHtml
    + '<div style="margin-top:24px"><button class="toggle-btn" style="background:var(--primary);color:#fff;padding:10px 24px;border-radius:8px;font-size:14px" onclick="switchMode(\'practice\')">📝 返回练习模式</button></div></div>';

  clearCurrentProgress();
  localStorage.removeItem('ai_trainer_finish_judge');
}

// ===== 练习模式核心 =====
function startNewRound() {
  if (resumedMidRound && currentPool.length > 0 && currentIndex < currentPool.length) {
    resumedMidRound = false;
    if (roundResults.length >= currentPool.length) { showRoundFinish(); return; }
    updateRoundUI(); renderQuestion(); return;
  }
  resumedMidRound = false;
  localStorage.removeItem('ai_trainer_finish_judge');
  submitted = false; selectedAnswer = null; roundResults = [];

  if (currentMode === 'fav') {
    // 收藏模式
    currentPool = allQuestions.filter(function(q) { return favorites.has(q.id); });
    if (currentTag) currentPool = currentPool.filter(function(q) { return q.tags && q.tags.indexOf(currentTag) >= 0; });
  } else if (currentMode === 'spaced') {
    // 间隔重复模式
    var dueIds = getSpacedDueIds();
    currentPool = allQuestions.filter(function(q) { return dueIds.indexOf(q.id) >= 0; });
    if (currentTag) currentPool = currentPool.filter(function(q) { return q.tags && q.tags.indexOf(currentTag) >= 0; });
  } else {
    // 练习模式
    if (!globalWrongIds || globalWrongIds.size === 0) {
      currentPool = allQuestions.slice(); roundNumber = 1;
    } else {
      var ids = new Set(globalWrongIds);
      currentPool = allQuestions.filter(function(q) { return ids.has(q.id); });
    }
    if (currentTag) currentPool = currentPool.filter(function(q) { return q.tags && q.tags.indexOf(currentTag) >= 0; });
  }

  shuffle(currentPool); currentIndex = 0;
  updateRoundUI();
  if (currentPool.length > 0) { renderQuestion(); } else { showEmptyPool(); }
}

function showEmptyPool() {
  var area = document.getElementById('questionArea');
  var msg = currentMode === 'fav' ? '还没有收藏题目，练习时点击 ☆ 收藏吧！' :
            currentMode === 'spaced' ? '暂无需要复习的题目，做得好！' : '暂无题目';
  area.innerHTML = '<div class="finish-panel"><div class="big-icon">📭</div><h2>' + msg + '</h2>'
    + '<button class="toggle-btn" style="margin-top:16px;background:var(--primary);color:#fff;padding:8px 20px;border-radius:8px" onclick="switchMode(\'practice\')">📝 返回练习模式</button></div>';
}

function updateRoundUI() {
  var label = reviewingRound ? '📖 回顾第' + reviewingRound + '轮错题' :
              currentMode === 'fav' ? '⭐ 收藏题练习' :
              currentMode === 'spaced' ? '🔁 间隔复习' :
              '第 ' + roundNumber + ' 轮';
  document.getElementById('roundBadge').textContent = label;
  updateStats(); updateProgress();
}

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
}

function renderQuestion(reviewMode) {
  if (currentIndex >= currentPool.length) { showRoundFinish(); return; }
  var q = currentPool[currentIndex];
  var result = roundResults.find(function(r) { return r.id === q.id; });
  if (result && !reviewMode) { submitted = true; }
  else if (!result) { submitted = false; selectedAnswer = null; }

  var area = document.getElementById('questionArea');
  var btnTrueClass = 'btn-judge btn-true';
  var btnFalseClass = 'btn-judge btn-false';
  var btnTrueDisabled = '';
  var btnFalseDisabled = '';

  if (result) {
    btnTrueDisabled = ' disabled';
    btnFalseDisabled = ' disabled';
    if (result.correct) {
      if (q.answer === true) { btnTrueClass += ' correct-highlight'; }
      else { btnFalseClass += ' correct-highlight'; }
    } else {
      if (result.userAnswer === true) { btnTrueClass += ' wrong-highlight'; }
      else { btnFalseClass += ' wrong-highlight'; }
      if (q.answer === true) { btnTrueClass += ' correct-highlight'; }
      else { btnFalseClass += ' correct-highlight'; }
    }
  }

  var resultHtml = '';
  if (result) {
    if (result.correct) {
      resultHtml = '<div class="q-result show" style="background:#ecfdf5;color:#065f46">✅ <b>回答正确！</b></div>';
    } else {
      var correctLabel = q.answer ? '正确' : '错误';
      var yourLabel = result.userAnswer ? '正确' : '错误';
      var yourCls = result.userAnswer ? 'ans-true' : 'ans-false';
      var correctCls = q.answer ? 'ans-true' : 'ans-false';
      resultHtml = '<div class="q-result show" style="background:#fef2f2;color:#991b1b">❌ <b>回答错误！</b> 你的答案：<span class="q-tag ' + yourCls + '">' + yourLabel + '</span> 正确答案：<span class="q-tag ' + correctCls + '">' + correctLabel + '</span></div>';
    }
  }

  // 间隔重复标记
  var spacedBadge = '';
  if (spacedRepetition[q.id]) {
    var sr = spacedRepetition[q.id];
    spacedBadge = '<span class="spaced-badge">🔁 ' + sr.interval + '天后复查</span>';
  }

  var isFav = favorites.has(q.id);

  area.innerHTML = '<div class="card">'
    + '<div class="q-header"><div class="q-num">第 ' + q.id + ' 题' + spacedBadge + '</div><div style="display:flex;align-items:center;gap:8px"><div class="q-timer" id="qTimer"></div><button class="fav-btn' + (isFav?' active':'') + '" id="favBtn" onclick="toggleFavorite(' + q.id + ')">' + (isFav?'⭐':'☆') + '</button></div></div>'
    + '<div class="q-tags">' + (q.tags||[]).map(function(t){return '<span class="q-tag-label">'+t+'</span>';}).join('') + '</div>'
    + '<div class="q-text">' + escapeHtml(q.text) + '</div>'
    + '<div class="btn-row">'
    + '<button class="' + btnTrueClass + '" id="btnTrue" onclick="chooseAnswer(true)"' + btnTrueDisabled + '>✅ 正确</button>'
    + '<button class="' + btnFalseClass + '" id="btnFalse" onclick="chooseAnswer(false)"' + btnFalseDisabled + '>❌ 错误</button>'
    + '</div>'
    + resultHtml + '</div>';

  updateProgress(); renderNav();
  startQuestionTimer();
}

function chooseAnswer(ans) {
  if (submitted) return;
  selectedAnswer = ans;
  submitAnswer();
}

function submitAnswer() {
  if (submitted || selectedAnswer === null) return;
  // Guard: don't allow re-submit on already-answered question
  if (roundResults.some(function(r) { return r.id === currentPool[currentIndex].id; })) return;
  submitted = true;
  stopQuestionTimer();
  var q = currentPool[currentIndex];
  var isCorrect = (selectedAnswer === q.answer);
  roundResults.push({ id: q.id, correct: isCorrect, userAnswer: selectedAnswer });
  recordQuestionTime(q.id);
  addSpacedRepetition(q.id, isCorrect);
  updateSpacedCount();

  var btnT = document.getElementById('btnTrue');
  var btnF = document.getElementById('btnFalse');
  var card = document.querySelector('.card');

  if (btnT) btnT.disabled = true;
  if (btnF) btnF.disabled = true;

  var correctLabel = q.answer ? '正确' : '错误';
  var yourLabel = selectedAnswer ? '正确' : '错误';

  // 创建结果区域
  var resEl = document.createElement('div');
  resEl.className = 'q-result show';
  card.appendChild(resEl);

  if (isCorrect) {
    if (q.answer === true && btnT) { btnT.classList.add('correct-highlight'); }
    else if (btnF) { btnF.classList.add('correct-highlight'); }
    resEl.style.background = '#ecfdf5'; resEl.style.color = '#065f46';
    resEl.innerHTML = '✅ <b>回答正确！</b>';
    autoAdvancing = true;
    setTimeout(function() {
      autoAdvancing = false;
      if (currentIndex >= currentPool.length - 1) { showRoundFinish(); }
      else { currentIndex++; saveProgress(); renderQuestion(); window.scrollTo({ top:0, behavior:'smooth' }); }
    }, 400);
  } else {
    if (selectedAnswer === true && btnT) { btnT.classList.add('wrong-highlight'); }
    else if (btnF) { btnF.classList.add('wrong-highlight'); }
    if (q.answer === true && btnT) { btnT.classList.add('correct-highlight'); }
    else if (btnF) { btnF.classList.add('correct-highlight'); }
    var yourCls = selectedAnswer ? 'ans-true' : 'ans-false';
    var correctCls = q.answer ? 'ans-true' : 'ans-false';
    resEl.style.background = '#fef2f2'; resEl.style.color = '#991b1b';
    resEl.innerHTML = '❌ <b>回答错误！</b> 你的答案：<span class="q-tag ' + yourCls + '">' + yourLabel + '</span> 正确答案：<span class="q-tag ' + correctCls + '">' + correctLabel + '</span>';
    autoAdvancing = true;
    setTimeout(function() {
      autoAdvancing = false;
      if (currentIndex >= currentPool.length - 1) { showRoundFinish(); }
      else { currentIndex++; saveProgress(); renderQuestion(); window.scrollTo({ top:0, behavior:'smooth' }); }
    }, 1500);
  }

  updateStats(); updateProgress(); saveProgress(); renderNav();
}

function goToQuestion(idx) {
  if (autoAdvancing) return;
  if (idx < 0 || idx >= currentPool.length) return;
  currentIndex = idx;
  var done = roundResults.find(function(r) { return r.id === currentPool[idx].id; });
  renderQuestion(!!done);
  window.scrollTo({ top:0, behavior:'smooth' });
}

function renderNav() {
  var nav = document.getElementById('qNav');
  if (!nav) return;
  var total = currentPool.length;
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var navPos = document.getElementById('navPos');
  if (prevBtn) prevBtn.disabled = currentIndex <= 0;
  if (nextBtn) nextBtn.disabled = currentIndex >= total - 1;
  if (navPos) navPos.textContent = (currentIndex + 1) + ' / ' + total;
  nav.style.display = 'block';
}

function updateStats() {
  var total = currentPool.length;
  var done = roundResults.length;
  var correct = roundResults.filter(function(r) { return r.correct; }).length;
  var wrong = roundResults.filter(function(r) { return !r.correct; }).length;
  var remain = total - done;
  var pct = done > 0 ? Math.round(correct / done * 100) : '-';
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('remainCount').textContent = remain;
  document.getElementById('scorePercent').textContent = pct === '-' ? '-' : pct + '%';
  var hb = document.getElementById('historyBar');
  if (hb) {
    hb.style.display = roundHistory.length > 0 ? 'block' : 'none';
    var hc = document.getElementById('historyCount');
    if (hc) hc.textContent = roundHistory.length;
  }
}

function updateProgress() {
  var total = currentPool.length;
  var done = roundResults.length;
  var pct = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressCur').textContent = done + ' / ' + total;
  document.getElementById('progressPct').textContent = pct + '%';
}

// ===== 轮次完成 =====
function showRoundFinish() {
  var total = currentPool.length;
  // Dedup: keep only last result per question
  var lastResult = {};
  for (var lri = 0; lri < roundResults.length; lri++) {
    lastResult[roundResults[lri].id] = roundResults[lri];
  }
  var correct = 0, wrong = 0;
  var qids = Object.keys(lastResult);
  for (var qi = 0; qi < qids.length; qi++) {
    if (lastResult[qids[qi]].correct) correct++; else wrong++;
  }
  var pct = total > 0 ? Math.round(correct / total * 100) : 0;
  snapshotPreRoundWrongIds = globalWrongIds ? new Set(globalWrongIds) : null;
  snapshotPreRoundNumber = roundNumber;
  updateStats(); updateProgress();
  var wrongIds = []; for (var wi = 0; wi < qids.length; wi++) { if (!lastResult[qids[wi]].correct) wrongIds.push(parseInt(qids[wi])); }
  if (!reviewingRound) {
    roundHistory.push({ round: roundNumber, correct: correct, wrong: wrong, pct: pct, wrongIds: wrongIds });
  }
  globalWrongIds = new Set();
  for (var gi = 0; gi < roundHistory.length; gi++) {
    for (var gj = 0; gj < roundHistory[gi].wrongIds.length; gj++) { globalWrongIds.add(roundHistory[gi].wrongIds[gj]); }
  }
  saveToStorage(); updateSpacedCount();

  var emoji = pct === 100 ? '🎉' : pct >= 80 ? '😊' : pct >= 60 ? '💪' : '📚';
  var msg = pct === 100 ? '太棒了，全部正确！' : pct >= 80 ? '不错，继续保持！' : pct >= 60 ? '还需努力，加油！' : '多加练习，你可以的！';
  var allClear = (!globalWrongIds || globalWrongIds.size === 0);
  var finishData = { roundNumber: roundNumber, correct: correct, wrong: wrong, pct: pct, total: total, emoji: emoji, msg: msg, hasWrong: wrong > 0, allClear: allClear };
  if (wrong > 0) {
    finishData.wrongItems = wrongIds.map(function(wid) { var r = lastResult[wid]; return (function(q) {
      var q = allQuestions.find(function(x) { return x.id === wid; });
      return { id: wid, text: q ? q.text.substring(0, 50) + (q.text.length > 50 ? '...' : '') : '' };
    })(r); });
  }
  localStorage.setItem('ai_trainer_finish_judge', JSON.stringify(finishData));
  clearCurrentProgress();

  if (reviewingRound) {
    renderReviewFinish({ roundNumber: reviewingRound, correct: correct, wrong: wrong, pct: pct, total: total, emoji: emoji, msg: msg, wrongItems: finishData.wrongItems });
    reviewingRound = 0;
    return;
  }
  renderFinishPanel(finishData);
}

function renderFinishPanel(data) {
  var area = document.getElementById('questionArea');
  if (!area) return;
  var rn = data.roundNumber, correct = data.correct, wrong = data.wrong, pct = data.pct, total = data.total;
  var emoji = data.emoji, msg = data.msg, hasWrong = data.hasWrong, wrongItems = data.wrongItems, allClear = data.allClear;

  var wrongListHtml = '';
  if (hasWrong && wrongItems && wrongItems.length > 0) {
    wrongListHtml = '<div style="text-align:left;margin-top:20px"><h4 style="margin-bottom:10px">📋 本轮错误题目：</h4><table class="summary-table"><thead><tr><th>题号</th><th>题目</th></tr></thead><tbody>'
      + wrongItems.map(function(r) { return '<tr class="summary-row"><td><span class="dot red"></span>' + r.id + '</td><td>' + escapeHtml(r.text || '') + '</td></tr>'; }).join('')
      + '</tbody></table></div>';
  }

  var historyHtml = buildHistoryHtml();

  var btnArea = '';
  if (hasWrong) {
    var mergedCount = globalWrongIds ? globalWrongIds.size : wrong;
    btnArea = '<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:360px;margin:0 auto"><button class="toggle-btn" style="background:var(--primary);color:#fff;padding:10px 20px;border-radius:8px;flex:1;min-width:140px" onclick="redoRound()">🔄 重做本轮（' + total + ' 题）</button><button class="toggle-btn" style="background:#f59e0b;color:#fff;padding:10px 20px;border-radius:8px;flex:1;min-width:140px;border:2px solid #f59e0b" onclick="retryWrong()">⏭ 下一轮（只做错题 · ' + mergedCount + ' 题）</button></div>';
  } else if (allClear) {
    btnArea = '<button class="toggle-btn" style="background:var(--success);color:#fff;padding:10px 24px;border-radius:8px" onclick="resetAll()">🏆 重新开始挑战</button>';
  } else {
    btnArea = '<button class="toggle-btn" style="background:var(--primary);color:#fff;padding:10px 24px;border-radius:8px" onclick="resetAll()">🔄 重新开始全部练习</button>';
  }

  // 计时统计
  var timeStatsHtml = buildTimeStats(roundResults.map(function(r){return allQuestions.find(function(q){return q.id===r.id})}).filter(Boolean));

  area.innerHTML = '<div class="finish-panel"><div class="big-icon">' + emoji + '</div><h2>第 ' + rn + ' 轮完成！</h2><div class="score">' + pct + '%</div><p class="detail">' + correct + ' / ' + total + ' 正确，' + wrong + ' 题错误</p><p style="color:var(--muted);font-size:14px">' + msg + '</p>' + wrongListHtml + historyHtml + timeStatsHtml + btnArea
    + '<button class="toggle-btn" style="margin-top:12px;color:var(--danger)" onclick="if(confirm(\'确定要清空所有记录吗？\'))resetAll()">🗑 清空记录，从头开始</button></div>';
  window.scrollTo({ top:0, behavior:'smooth' });
}

function showAllClear() {
  var total = allQuestions.length;
  var area = document.getElementById('questionArea');
  area.innerHTML = '<div class="finish-panel"><div class="big-icon">🏆</div><h2>全部通关！</h2><p style="color:var(--muted);margin:8px 0 20px">' + total + '道判断题已全部掌握！</p><button class="toggle-btn" style="background:var(--primary);color:#fff;padding:10px 24px;border-radius:8px" onclick="resetAll()">🔄 重新开始挑战</button></div>';
  document.getElementById('roundBadge').textContent = '🏆 通关';
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressCur').textContent = total + ' / ' + total;
  document.getElementById('progressPct').textContent = '100%';
}

function renderReviewFinish(data) {
  var area = document.getElementById('questionArea');
  if (!area) return;
  var rn = data.roundNumber, correct = data.correct, wrong = data.wrong, pct = data.pct, total = data.total;
  var emoji = data.emoji, msg = data.msg, wrongItems = data.wrongItems;
  var wrongListHtml = '';
  if (wrongItems && wrongItems.length > 0) {
    wrongListHtml = '<div style="text-align:left;margin-top:20px"><h4 style="margin-bottom:10px">📋 本次错误题目：</h4><table class="summary-table"><thead><tr><th>题号</th><th>题目</th></tr></thead><tbody>'
      + wrongItems.map(function(r) { return '<tr class="summary-row"><td><span class="dot red"></span>' + r.id + '</td><td>' + escapeHtml(r.text || '') + '</td></tr>'; }).join('')
      + '</tbody></table></div>';
  }
  area.innerHTML = '<div class="finish-panel"><div class="big-icon">' + emoji + '</div><h2>回顾第' + rn + '轮错题 · 完成</h2><div class="score">' + pct + '%</div><p class="detail">' + correct + ' / ' + total + ' 正确，' + wrong + ' 题错误</p><p style="color:var(--muted);font-size:14px">' + msg + '</p>' + wrongListHtml
    + '<button class="toggle-btn" style="margin-top:16px;background:var(--primary);color:#fff;padding:10px 24px;border-radius:8px" onclick="switchMode(\'practice\')">📝 返回练习模式</button></div>';
  window.scrollTo({ top:0, behavior:'smooth' });
}

// ===== 历史回顾 =====
function buildHistoryHtml() {
  if (roundHistory.length === 0) return '';
  var html = '<div style="text-align:left;margin-top:20px"><div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:8px 0;border-bottom:1.5px solid var(--border);margin-bottom:12px" onclick="toggleHistory()"><h4 style="margin:0;font-size:14px">📊 各轮错题回顾（' + roundHistory.length + ' 轮）</h4><span id="historyToggle" style="font-size:18px;color:var(--muted)">▼</span></div><div id="historyBody" style="display:none">';
  for (var hi = 0; hi < roundHistory.length; hi++) {
    var h = roundHistory[hi];
    var wrongQItems = '';
    for (var wi = 0; wi < h.wrongIds.length; wi++) {
      var q = allQuestions.find(function(x) { return x.id === h.wrongIds[wi]; });
      var text = q ? q.text.substring(0, 40) + (q.text.length > 40 ? '...' : '') : '';
      wrongQItems += '<tr style="font-size:12px"><td><span class="dot red"></span>' + h.wrongIds[wi] + '</td><td>' + escapeHtml(text) + '</td></tr>';
    }
    var hEmoji = h.pct === 100 ? '🎉' : h.pct >= 80 ? '😊' : h.pct >= 60 ? '💪' : '📚';
    html += '<div class="history-entry"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><span style="font-weight:600;font-size:14px">' + hEmoji + ' 第' + h.round + '轮' + (h.exam?' 🎓考试':'') + '</span><span style="font-size:13px;color:var(--muted)">' + h.correct + '/' + (h.correct + h.wrong) + ' · ' + h.pct + '%</span></div>';
    if (h.wrongIds.length > 0) {
      html += '<table class="summary-table" style="margin-bottom:8px"><thead><tr><th>题号</th><th>题目</th></tr></thead><tbody>' + wrongQItems + '</tbody></table>';
      html += '<button class="toggle-btn" style="background:#6366f1;color:#fff;padding:4px 14px;border-radius:6px;font-size:12px" onclick="event.stopPropagation();retryRoundWrong(' + h.round + ', [' + h.wrongIds.join(',') + '])">📝 重做第' + h.round + '轮错题（' + h.wrongIds.length + ' 题）</button>';
    } else { html += '<p style="font-size:12px;color:var(--success);margin:4px 0">✅ 全部正确</p>'; }
    html += '</div>';
  }
  // 合并按钮
  var allWrongSet = new Set();
  for (var ai = 0; ai < roundHistory.length; ai++) {
    for (var aj = 0; aj < roundHistory[ai].wrongIds.length; aj++) { allWrongSet.add(roundHistory[ai].wrongIds[aj]); }
  }
  var allWrongArr = Array.from(allWrongSet);
  if (allWrongArr.length > 0 && allWrongArr.length !== (roundHistory[roundHistory.length-1].wrongIds || []).length) {
    html += '<div style="margin-top:10px;text-align:center"><button class="toggle-btn" style="background:#f59e0b;color:#fff;border:2px solid #f59e0b;padding:6px 18px;border-radius:8px" onclick="event.stopPropagation();retryRoundWrong(0, [' + allWrongArr.join(',') + '])">🔄 重做所有轮错题合并（' + allWrongArr.length + ' 题）</button></div>';
  }
  html += '</div></div>';
  return html;
}

// ===== 计时统计 =====
function buildTimeStats(pool) {
  if (!pool || pool.length === 0) return '';
  var items = pool.filter(function(q) { return questionTimes[q.id]; }).map(function(q) { return { id: q.id, text: q.text || '', time: questionTimes[q.id] }; }).sort(function(a,b) { return b.time - a.time; });
  if (items.length === 0) return '';
  var maxTime = items[0].time;
  var slowItems = items.slice(0, 10); // 最慢的10题
  var html = '<div class="time-stats"><h4>⏱ 答题最慢的题目（Top 10）</h4>';
  slowItems.forEach(function(item) {
    var pct = maxTime > 0 ? Math.round(item.time / maxTime * 100) : 0;
    var color = item.time > 30 ? 'var(--danger)' : item.time > 15 ? '#f59e0b' : 'var(--success)';
    html += '<div class="time-bar-wrap"><div class="time-bar-label">第' + item.id + '题 · ' + item.time + '秒' + (item.time > 30 ? ' ⚠️' : '') + '</div><div class="time-bar"><div class="time-bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div></div>';
  });
  html += '</div>';
  return html;
}

// ===== 轮次操作 =====
function redoRound() {
  globalWrongIds = snapshotPreRoundWrongIds;
  roundNumber = snapshotPreRoundNumber;
  roundHistory = roundHistory.filter(function(h) { return h.round !== roundNumber; });
  reviewingRound = 0; resumedMidRound = false;
  clearCurrentProgress();
  localStorage.removeItem('ai_trainer_finish_judge');
  startNewRound();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function retryWrong() {
  reviewingRound = 0; resumedMidRound = false;
  clearCurrentProgress();
  localStorage.removeItem('ai_trainer_finish_judge');
  roundNumber++;
  localStorage.setItem('ai_trainer_round_judge', roundNumber);
  var merged = new Set();
  for (var i = 0; i < roundHistory.length; i++) {
    for (var j = 0; j < roundHistory[i].wrongIds.length; j++) { merged.add(roundHistory[i].wrongIds[j]); }
  }
  globalWrongIds = merged;
  startNewRound();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function retryRoundWrong(round, wrongIds) {
  if (!wrongIds || wrongIds.length === 0) return;
  reviewingRound = round; resumedMidRound = false;
  localStorage.removeItem('ai_trainer_finish_judge');
  currentPool = wrongIds.map(function(id) { return allQuestions.find(function(q) { return q.id === id; }); }).filter(Boolean);
  shuffle(currentPool);
  currentIndex = 0; roundResults = []; selectedAnswer = null; submitted = false;
  clearCurrentProgress();
  var label = round === 0 ? '所有轮错题合并' : '第' + round + '轮错题';
  document.getElementById('roundBadge').textContent = '📖 ' + label + '（' + currentPool.length + ' 题）';
  document.getElementById('progressCur').textContent = '0 / ' + currentPool.length;
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressPct').textContent = '0%';
  renderQuestion();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function resetAll() {
  reviewingRound = 0; resumedMidRound = false;
  globalWrongIds = null; roundNumber = 1;
  currentMode = 'practice'; currentTag = '';
  stopExamTimer();
  document.getElementById('modePractice').classList.add('active');
  document.getElementById('modeExam').classList.remove('active');
  document.getElementById('modeFav').classList.remove('active');
  document.getElementById('modeSpaced').classList.remove('active');
  document.getElementById('examBanner').style.display = 'none';
  document.getElementById('toolbar').style.display = 'flex';
  var tagSel = document.getElementById('tagFilter');
  if (tagSel) tagSel.value = '';
  clearStorage(); startNewRound();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function toggleHistory() {
  var body = document.getElementById('historyBody');
  var toggle = document.getElementById('historyToggle');
  if (!body || !toggle) return;
  if (body.style.display === 'none') { body.style.display = 'block'; toggle.textContent = '▲'; }
  else { body.style.display = 'none'; toggle.textContent = '▼'; }
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== 键盘 =====
document.addEventListener('keydown', function(e) {
  if (autoAdvancing) return;
  if (currentMode === 'exam') {
    // 考试模式：T/F选择，Enter下一题
    if (e.key === 'Enter') { e.preventDefault(); if (currentIndex < currentPool.length - 1) { currentIndex++; renderExamQuestion(); } return; }
    return;
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    if (!submitted) { if (selectedAnswer !== null) submitAnswer(); }
    else { if (currentIndex < currentPool.length - 1) { currentIndex++; saveProgress(); renderQuestion(); } }
    return;
  }
  if (!submitted) {
    if (e.key === 't' || e.key === 'T') { e.preventDefault(); chooseAnswer(true); return; }
    if (e.key === 'f' || e.key === 'F') { e.preventDefault(); chooseAnswer(false); return; }
  }
  if (e.key === 'a' || e.key === 'A') { e.preventDefault(); if (currentIndex > 0) goToQuestion(currentIndex - 1); }
  if (e.key === 'd' || e.key === 'D') { e.preventDefault(); if (currentIndex < currentPool.length - 1) goToQuestion(currentIndex + 1); }
});

init();
</script>
