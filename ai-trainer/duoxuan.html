<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>多选题快速提分 v3</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;background:#f3f4f6;color:#374151;min-height:100vh;-webkit-font-smoothing:antialiased}
.app-header{background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.app-header-inner{max-width:900px;margin:0 auto;padding:12px 16px 0}
.app-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.app-title span{background:#10b981;color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.tabs{display:flex;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-wrap:nowrap}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex:1;min-width:0;padding:10px 4px;font-size:12px;font-weight:600;background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;transition:all .2s;color:#9ca3af;white-space:nowrap}
.tab-btn:hover{color:#6b7280}
.tab-btn.active{color:#10b981;border-bottom-color:#10b981}
.tab-btn .badge{display:inline-block;margin-left:3px;background:#e5e7eb;color:#6b7280;font-size:10px;padding:1px 6px;border-radius:8px;font-weight:600}
.tab-btn.active .badge{background:#d1fae5;color:#059669}
.main-content{max-width:900px;margin:0 auto;padding:16px}
.tab-panel{display:none}
.tab-panel.active{display:block}
.card{background:#fff;border-radius:12px;padding:18px 16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #e5e7eb}
.q-header{display:flex;align-items:flex-start;gap:8px;margin-bottom:14px}
.q-num{min-width:26px;height:26px;background:#f3f4f6;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#9ca3af;flex-shrink:0}
.q-text{font-size:15px;line-height:1.6;font-weight:500}
.fullcorrect-list,.three-list{display:flex;flex-direction:column;gap:8px}
.fullcorrect-item,.three-item{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:8px;border-left:4px solid #10b981;background:#ecfdf5}
.three-item{background:#eef2ff;border-left-color:#6366f1}
.fullcorrect-item .fc-icon,.three-item .fc-icon{font-size:16px}
.fullcorrect-item .fc-text{font-size:14px;line-height:1.5;color:#065f46}
.three-item .fc-text{font-size:14px;line-height:1.5;color:#3730a3}
.mine-options,.three-options{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.mine-opt,.three-opt{padding:10px 14px;border-radius:8px;font-size:14px;line-height:1.5;border:1px solid #e5e7eb}
.mine-opt.correct,.three-opt.correct{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
.mine-opt.wrong{background:#fef2f2;border-color:#fecaca;color:#991b1b;text-decoration:line-through;font-weight:700;box-shadow:0 0 0 2px #fecaca}
.three-opt.wrong{background:#fef2f2;border-color:#fecaca;color:#991b1b;text-decoration:line-through;font-weight:700}
.mine-opt .opt-label,.three-opt .opt-label{display:inline-block;font-size:11px;font-weight:700;width:20px;height:20px;line-height:20px;text-align:center;border-radius:4px;margin-right:8px}
.mine-opt.correct .opt-label,.three-opt.correct .opt-label{background:#bbf7d0;color:#166534}
.mine-opt.wrong .opt-label,.three-opt.wrong .opt-label{background:#fecaca;color:#991b1b}
.mine-analysis,.three-analysis{margin-top:12px;padding:12px 14px;background:#fff7ed;border-radius:8px;border:1px solid #fed7aa;font-size:13px;line-height:1.6;color:#9a3412}
.mine-analysis strong,.three-analysis strong{color:#c2410c}
.twins-container{display:flex;gap:10px;margin-top:4px}
.twins-col{flex:1}
.twins-col h4{font-size:12px;font-weight:700;margin-bottom:6px}
.twins-col.green h4{color:#059669}
.twins-col.red h4{color:#dc2626}
.twins-item{padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.5;margin-bottom:6px}
.twins-col.green .twins-item{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
.twins-col.red .twins-item{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.twins-col .opt-letter{font-size:11px;font-weight:700;margin-right:6px}

/* Practice mode */
.practice-area{display:flex;flex-direction:column;gap:0}
.mode-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.mode-btn{padding:6px 14px;border-radius:6px;border:1px solid #d1d5db;background:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;color:#6b7280}
.mode-btn:hover{border-color:#10b981;color:#10b981}
.mode-btn.active{background:#10b981;color:#fff;border-color:#10b981}
.mode-btn .badge-sm{font-size:10px;margin-left:4px;opacity:.8}
.cat-filter{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.cat-chip{padding:4px 10px;border-radius:12px;border:1px solid #e5e7eb;background:#fff;font-size:11px;cursor:pointer;transition:all .15s;color:#6b7280;white-space:nowrap}
.cat-chip:hover{border-color:#6366f1}
.cat-chip.active{background:#6366f1;color:#fff;border-color:#6366f1}
.voice-btn{padding:6px 12px;border-radius:6px;border:1px solid #d1d5db;background:#fff;font-size:12px;cursor:pointer;color:#6b7280;transition:all .15s;display:flex;align-items:center;gap:4px}
.voice-btn:hover{border-color:#f59e0b;color:#f59e0b}
.voice-btn.speaking{border-color:#f59e0b;background:#fffbeb;color:#d97706;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

.quiz-option{display:flex;align-items:center;gap:10px;padding:11px 14px;margin-bottom:6px;border:1.5px solid #e5e7eb;border-radius:8px;cursor:pointer;transition:all .15s;background:#fff;font-size:14px;line-height:1.5;user-select:none;-webkit-tap-highlight-color:transparent}
.quiz-option:hover{border-color:#d1d5db;background:#f9fafb}
.quiz-option.selected{border-color:#6366f1;background:#eef2ff;box-shadow:0 0 0 1px #6366f1}
.quiz-option .opt-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;background:#f3f4f6;border-radius:6px;font-size:12px;font-weight:700;color:#6b7280;flex-shrink:0}
.quiz-option.selected .opt-letter{background:#6366f1;color:#fff}
.quiz-option.correct{border-color:#10b981;background:#ecfdf5}
.quiz-option.correct .opt-letter{background:#10b981;color:#fff}
.quiz-option.wrong{border-color:#ef4444;background:#fef2f2}
.quiz-option.wrong .opt-letter{background:#ef4444;color:#fff}
.quiz-option.correct-highlight{border-color:#10b981;background:#f0fdf4}
.quiz-option.correct-highlight .opt-letter{background:#10b981;color:#fff}
.quiz-option.missed{border-color:#f59e0b;background:#fffbeb}
.quiz-option.missed .opt-letter{background:#f59e0b;color:#fff}

.quiz-controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{padding:10px 20px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:#10b981;color:#fff}
.btn-primary:hover{background:#059669}
.btn-primary:disabled{background:#d1d5db;cursor:not-allowed}
.btn-skip{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.btn-skip:hover{background:#fde68a}
.btn-secondary{background:#f3f4f6;color:#374151;border:1px solid #e5e7eb}
.btn-secondary:hover{background:#e5e7eb}
.btn-danger{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.btn-danger:hover{background:#fee2e2}

.quiz-result{margin-top:12px;padding:14px;border-radius:8px;font-size:14px;font-weight:600;text-align:center}
.quiz-result.correct{background:#ecfdf5;color:#065f46}
.quiz-result.wrong{background:#fef2f2;color:#991b1b;text-align:left;line-height:1.7}
.quiz-result.wrong .wa{margin-top:8px;padding:10px 12px;background:#fff7ed;border-radius:6px;border:1px solid #fed7aa;color:#9a3412;font-size:13px;font-weight:400}
.quiz-result.skipped{background:#fef3c7;color:#92400e}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:13px;color:#6b7280}
.quiz-meta .score{font-weight:700;color:#10b981}
.quiz-meta .wrong-count{font-weight:700;color:#ef4444}
.empty-state{text-align:center;padding:60px 20px;color:#9ca3af}
.empty-state .icon{font-size:48px;margin-bottom:12px}

/* Accuracy panel */
.acc-panel{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;padding:12px;background:#fff;border-radius:10px;border:1px solid #e5e7eb}
.acc-item{flex:1;min-width:100px;text-align:center;padding:8px;border-radius:8px;background:#f9fafb;border:1px solid #f3f4f6}
.acc-item .acc-label{font-size:11px;color:#9ca3af;margin-bottom:4px}
.acc-item .acc-pct{font-size:20px;font-weight:800}
.acc-item .acc-detail{font-size:10px;color:#9ca3af}
.acc-item.good .acc-pct{color:#10b981}
.acc-item.warn .acc-pct{color:#f59e0b}
.acc-item.bad .acc-pct{color:#ef4444}

/* Exam timer */
.exam-timer{font-size:24px;font-weight:800;color:#6366f1;text-align:center;margin-bottom:12px;font-variant-numeric:tabular-nums}
.exam-timer.warning{color:#f59e0b;animation:pulse 1s infinite}
.exam-timer.danger{color:#ef4444;animation:pulse .5s infinite}

.answer-review{margin-top:6px;font-size:13px;color:#6b7280}
.answer-review .ar-correct{color:#059669;font-weight:600}
.answer-review .ar-wrong{color:#dc2626;font-weight:600;text-decoration:line-through}

/* Review mode */
.review-card{margin-bottom:12px}
.review-card .q-result-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;margin-left:8px}
.review-card .q-result-badge.correct{background:#d1fae5;color:#059669}
.review-card .q-result-badge.wrong{background:#fee2e2;color:#dc2626}

.cat-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;margin-left:8px}
.cat-tag.full{background:#d1fae5;color:#059669}
.cat-tag.mine{background:#fee2e2;color:#dc2626}
.cat-tag.twins{background:#dbeafe;color:#2563eb}
.cat-tag.three{background:#ede9fe;color:#7c3aed}

@media (max-width:480px){
.app-title{font-size:16px}
.tab-btn{font-size:11px;padding:10px 3px}
.card{padding:14px 12px}
.q-text{font-size:14px}
.twins-container{flex-direction:column;gap:8px}
.acc-item{min-width:70px}
.acc-item .acc-pct{font-size:16px}
}
@media (min-width:768px){
.card{padding:20px}
.q-text{font-size:16px}
}
</style>

      </button>
      <button class="tab-btn" data-tab="speed" onclick="switchTab('speed')">

      </button>
      <button class="tab-btn" data-tab="review" onclick="switchTab('review')">

</header>

<div class="main-content">

// ─── CATEGORIZE ───
const CAT = {};
(function(){
  for(const q of questionsData){
    const nc=q.correctAnswers.length, no=Object.keys(q.options).length;
    if(nc===no) CAT[q.id]='full';
    else if(no-nc===1) CAT[q.id]='mine';
    else if(nc===2) CAT[q.id]='twins';
    else if(nc===3 && no===5) CAT[q.id]='three';
    else CAT[q.id]='other';
  }
})();

const CAT_LABELS = {full:'全对类',mine:'找茬排雷',twins:'双胞胎',three:'三缺二',other:'其他'};
const CAT_EMOJI = {full:'✅',mine:'💣',twins:'👥',three:'🔷'};

function catOf(q){return CAT[q.id]||'other';}

// ─── UTILS ───
const OPT_LETTERS = ['A','B','C','D','E'];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

// ─── VOICE ───
let voiceSpeaking=false;
function speak(text,callback){
  if(!window.speechSynthesis){if(callback)callback();return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN';u.rate=1.0;u.pitch=1.0;
  u.onend=()=>{voiceSpeaking=false;updateVoiceBtn();if(callback)callback();};
  u.onerror=()=>{voiceSpeaking=false;updateVoiceBtn();if(callback)callback();};
  voiceSpeaking=true;updateVoiceBtn();
  speechSynthesis.speak(u);
}
function stopVoice(){speechSynthesis.cancel();voiceSpeaking=false;updateVoiceBtn();}
function updateVoiceBtn(){
  const b=document.getElementById('voiceBtn');
  if(b){b.classList.toggle('speaking',voiceSpeaking);b.textContent=voiceSpeaking?'🔊 朗读中...':'🔊 朗读';}
}
function speakQuestion(q){
  const opts=Object.keys(q.options).map(k=>k+'. '+q.options[k]).join('。');
  speak(q.question+'。选项：'+opts);
}

// ─── ACCURACY PANEL ───
function renderAccuracyPanel(){
  let h='<div class="acc-panel">';
  const cats=['full','mine','twins','three'];
  for(const c of cats){
    const total=questionsData.filter(q=>catOf(q)===c).length;
    const stats=catStats[c]||{correct:0,total:0};
    const pct=stats.total>0?Math.round(stats.correct/stats.total*100):null;
    let cls='';
    if(pct!==null){cls=pct>=80?'good':pct>=60?'warn':'bad';}
    h+='<div class="acc-item '+cls+'"><div class="acc-label">'+CAT_EMOJI[c]+' '+CAT_LABELS[c]+'</div>';
    h+='<div class="acc-pct">'+(pct!==null?pct+'%':'--')+'</div>';
    h+='<div class="acc-detail">答题'+stats.total+'/'+total+'题</div></div>';
  }
  h+='</div>';
  return h;
}

function getFilteredQuestions(){
  if(practiceFilter==='all')return [...questionsData];
  return questionsData.filter(q=>catOf(q)===practiceFilter);
}

function buildPracticeOrder(random){
  let qs=getFilteredQuestions();
  let indices=[...Array(qs.length).keys()];
  if(random)shuffle(indices);
  return indices;
}

function renderPracticeTab(tab){
  stopVoice();
  if(tab==='speed')practiceMode='speed';
  const panel=document.getElementById('panel-practice');
  panel.classList.add('active');

  if(tab!=='review'){
    practiceMode=tab;
    practiceIdx=0;practiceCorrect=0;practiceTotal=0;practiceSubmitted=false;
    practiceOrder=buildPracticeOrder(tab!=='practice');
    if(tab==='exam'){examTimeLeft=30*60;startExamTimer();}else{examTimeLeft=0;if(examTimer){clearInterval(examTimer);examTimer=null;}}
  }

  let h=renderAccuracyPanel();

  // Mode bar
  const modes=[
    {id:'practice',label:'📝 练习',desc:'按分类排序，答对自动跳'},
    {id:'exam',label:'🎯 考试',desc:'30分钟限时，提交统一判分'},
    {id:'speed',label:'⚡ 速刷',desc:'0.3秒自动跳，纯肌肉记忆'},
    {id:'review',label:'🔄 错题',desc:'仅重做错过题('+wrongList.length+'题)'}
  ];
  h+='<div class="mode-bar">';
  for(const m of modes){
    h+='<button class="mode-btn'+(practiceMode===m.id?' active':'')+'" onclick="switchPracticeMode(\''+m.id+'\')">'+m.label+'</button>';
  }
  h+='<button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">🔊 朗读</button>';
  h+='</div>';

  // Category filter (not for review)
  if(practiceMode!=='review'){
    h+='<div class="cat-filter">';
    const filters=[
      {id:'all',label:'全部 ('+questionsData.length+')'},
      {id:'full',label:'全对类 ('+questionsData.filter(q=>catOf(q)==='full').length+')'},
      {id:'mine',label:'排雷 ('+questionsData.filter(q=>catOf(q)==='mine').length+')'},
      {id:'twins',label:'双胞胎 ('+questionsData.filter(q=>catOf(q)==='twins').length+')'},
      {id:'three',label:'三缺二 ('+questionsData.filter(q=>catOf(q)==='three').length+')'}
    ];
    for(const f of filters){
      h+='<button class="cat-chip'+(practiceFilter===f.id?' active':'')+'" onclick="setPracticeFilter(\''+f.id+'\')">'+f.label+'</button>';
    }
    h+='</div>';

  if(practiceMode==='exam'&&examTimeLeft>0){
    const m=Math.floor(examTimeLeft/60),s=examTimeLeft%60;

    if(examTimeLeft<60)cls+=' danger';
    else if(examTimeLeft<300)cls+=' warning';
    h+='<div class="'+cls+'" id="examTimer">⏱ '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'</div>';
  }

  h+='<div id="practiceArea">';
  h+=renderPracticeQuestion();
  h+='</div>';
  panel.innerHTML=h;

function switchPracticeMode(mode){
  stopVoice();stopAutoTimer();
  if(mode==='review'&&wrongList.length===0){alert('还没有错题，先去做练习吧！');return;}
  practiceMode=mode;
  practiceIdx=0;practiceCorrect=0;practiceTotal=0;practiceSubmitted=false;
  if(mode==='review'){practiceOrder=buildReviewOrder();practiceFilter='all';}
  else{practiceOrder=buildPracticeOrder(mode!=='practice');}
  if(mode==='exam'){examTimeLeft=30*60;startExamTimer();}else{examTimeLeft=0;if(examTimer){clearInterval(examTimer);examTimer=null;}}
  renderPracticeTab(mode);
  window.scrollTo({top:0,behavior:'smooth'});
}

function setPracticeFilter(f){
  stopVoice();stopAutoTimer();
  practiceFilter=f;
  practiceIdx=0;practiceCorrect=0;practiceTotal=0;practiceSubmitted=false;
  practiceOrder=buildPracticeOrder(practiceMode!=='practice');
  renderPracticeTab(practiceMode);
  window.scrollTo({top:0,behavior:'smooth'});
}

function buildReviewOrder(){
  return [...Array(wrongList.length).keys()];
}

function renderPracticeQuestion(){
  const qs=getFilteredQuestions();
  if(practiceMode==='review'){
    if(wrongList.length===0)return '<div class="empty-state"><div class="icon">🎉</div><h3>没有错题</h3><p>太棒了，全对！</p></div>';
    if(practiceIdx>=wrongList.length){
      return renderPracticeFinish();
    }
    const w=wrongList[practiceIdx];
    const q=questionsData.find(x=>x.id===w.id);
    if(!q){practiceIdx++;return renderPracticeQuestion();}
    return renderQuestionCard(q,w);
  }

  if(!qs.length)return '<div class="empty-state"><div class="icon">📭</div><h3>没有题目</h3><p>换个分类试试</p></div>';
  if(practiceIdx>=practiceOrder.length)return renderPracticeFinish();
  const qi=practiceOrder[practiceIdx];
  const q=qs[qi];
  return renderQuestionCard(q,null);
}

function renderQuestionCard(q,reviewData){
  practiceSubmitted=false;stopAutoTimer();
  let h='';
  if(practiceMode==='exam'&&examTimeLeft<=0){return renderPracticeFinish();}

  // Progress
  const totalQ=(practiceMode==='review')?wrongList.length:practiceOrder.length;
  h+='<div class="quiz-meta">';
  h+='<span>第 '+(practiceIdx+1)+' / '+totalQ+' 题 <span class="cat-tag '+catOf(q)+'">'+CAT_LABELS[catOf(q)]+'</span></span>';
  h+='<span>✅ <span id="liveCorrect">'+practiceCorrect+'</span> / <span id="liveTotal">'+practiceTotal+'</span>';
  if(practiceTotal>0){const pct=Math.round(practiceCorrect/practiceTotal*100);h+=' ('+pct+'%)';}
  h+='</span></div>';

  if(reviewData){
    h+='<div class="answer-review" style="margin-bottom:8px">上次作答：';
    h+='<span class="ar-wrong">你选 ['+reviewData.yourAnswer.join(', ')+']</span> → ';
    h+='<span class="ar-correct">正确 ['+reviewData.correctAnswer.join(', ')+']</span></div>';
  }

  h+='<div class="card"><div class="q-header"><span class="q-num">#'+q.id+'</span><div class="q-text">'+escapeHtml(q.question)+'</div></div>';

  const allKeys=Object.keys(q.options);
  h+='<div id="quizOptions">';
  for(const k of allKeys){
    h+='<div class="quiz-option" data-key="'+k+'" onclick="toggleOption(\''+k+'\')"><span class="opt-letter">'+k+'</span>'+escapeHtml(q.options[k])+'</div>';
  }
  h+='</div>';

  if(practiceMode==='exam'){
    h+='<div class="quiz-controls"><button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()">确认提交</button><button class="btn btn-skip" onclick="skipQuestion()">跳过</button><button class="btn btn-secondary" onclick="nextPracticeQuestion()">下一题 →</button></div>';
  }else if(practiceMode==='speed'){
    h+='<div class="quiz-controls"><button class="btn btn-secondary" onclick="showSpeedAnswer()">看答案</button></div>';
  }else{
    // practice or review
    h+='<div class="quiz-controls"><button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()">确认提交</button><button class="btn btn-secondary" onclick="showAnswer()">看答案</button><button class="btn btn-skip" onclick="skipQuestion()">跳过</button></div>';
  }
  h+='<div id="quizResult"></div></div>';
  return h;
}

let selectedOptions=[];

function toggleOption(key){
  if(practiceSubmitted)return;
  const idx=selectedOptions.indexOf(key);
  if(idx>=0)selectedOptions.splice(idx,1);
  else selectedOptions.push(key);
  document.querySelectorAll('#quizOptions .quiz-option').forEach(el=>{
    el.classList.toggle('selected',selectedOptions.includes(el.dataset.key));
  });
}

function getCurrentQuestion(){
  const qs=getFilteredQuestions();
  if(practiceMode==='review'){
    if(practiceIdx>=wrongList.length)return null;
    const w=wrongList[practiceIdx];
    return questionsData.find(x=>x.id===w.id);
  }
  if(practiceIdx>=practiceOrder.length)return null;
  return qs[practiceOrder[practiceIdx]];
}

function submitAnswer(){
  if(practiceSubmitted)return;
  const q=getCurrentQuestion();
  if(!q)return;
  const correctSet=new Set(q.correctAnswers);
  const selectedSet=new Set(selectedOptions);
  let isCorrect=selectedSet.size===correctSet.size;
  if(isCorrect){for(const k of correctSet){if(!selectedSet.has(k)){isCorrect=false;break;}}}

  practiceSubmitted=true;practiceTotal++;
  if(isCorrect)practiceCorrect++;

  // Track category stats
  const c=catOf(q);
  if(!catStats[c])catStats[c]={correct:0,total:0};
  catStats[c].total++;
  if(isCorrect)catStats[c].correct++;
  saveCatStats();

  // Track wrong list
  if(!isCorrect&&practiceMode!=='speed'){
    const existing=wrongList.findIndex(w=>w.id===q.id);
    if(existing>=0)wrongList.splice(existing,1); // remove old, push new
    wrongList.push({id:q.id, yourAnswer:[...selectedOptions], correctAnswer:[...q.correctAnswers]});
    saveWrongList();
  }
  if(isCorrect){
    const existing=wrongList.findIndex(w=>w.id===q.id);
    if(existing>=0){wrongList.splice(existing,1);saveWrongList();}
  }

  // Visual feedback
  renderAnswerFeedback(q,correctSet,selectedSet,isCorrect);

  // Auto-advance
  if(isCorrect){
    const delay=practiceMode==='speed'?300:400;
    practiceAutoTimer=setTimeout(()=>{
      practiceAutoTimer=null;
      advanceQuestion();
    },delay);
  }
}

function renderAnswerFeedback(q,correctSet,selectedSet,isCorrect){
  document.querySelectorAll('#quizOptions .quiz-option').forEach(el=>{
    const k=el.dataset.key;
    el.classList.remove('selected');
    if(correctSet.has(k)&&!selectedSet.has(k))el.classList.add('correct-highlight');
    else if(selectedSet.has(k)&&!correctSet.has(k))el.classList.add('wrong');
    else if(selectedSet.has(k)&&correctSet.has(k))el.classList.add('correct');
    el.style.cursor='default';el.onclick=null;
  });

  const submitBtn=document.getElementById('submitBtn');
  if(submitBtn)submitBtn.disabled=true;

  const resultDiv=document.getElementById('quizResult');
  if(isCorrect){
    resultDiv.innerHTML='<div class="quiz-result correct">✅ 完全正确！</div>';
  }else{
    const missing=q.correctAnswers.filter(k=>!selectedSet.has(k));
    const extra=selectedOptions.filter(k=>!correctSet.has(k));
    let msg='';
    if(missing.length>0)msg+='漏选：'+missing.join(', ');
    if(extra.length>0)msg+=(msg?' | ':'')+'多选：'+extra.join(', ');
    let waHtml='';
    if(q.wrongAnalysis)waHtml='<div class="wa">💡 '+escapeHtml(q.wrongAnalysis)+'</div>';
    resultDiv.innerHTML='<div class="quiz-result wrong">❌ 回答错误。'+escapeHtml(msg)+waHtml+'</div>';
  }

  updateLiveScore();
}

function showAnswer(){
  if(practiceSubmitted)return;
  const q=getCurrentQuestion();
  if(!q)return;
  const correctSet=new Set(q.correctAnswers);
  practiceSubmitted=true;practiceTotal++;

  const c=catOf(q);
  if(!catStats[c])catStats[c]={correct:0,total:0};
  catStats[c].total++;
  saveCatStats();

  const existing=wrongList.findIndex(w=>w.id===q.id);
  if(existing>=0)wrongList.splice(existing,1);
  wrongList.push({id:q.id, yourAnswer:[], correctAnswer:[...q.correctAnswers]});
  saveWrongList();

  document.querySelectorAll('#quizOptions .quiz-option').forEach(el=>{
    const k=el.dataset.key;
    el.classList.remove('selected');
    if(correctSet.has(k))el.classList.add('correct-highlight');
    el.style.cursor='default';el.onclick=null;
  });
  const sb=document.getElementById('submitBtn');if(sb)sb.disabled=true;
  document.getElementById('quizResult').innerHTML='<div class="quiz-result skipped">📖 正确：'+q.correctAnswers.join(', ')+'</div>';
  updateLiveScore();
}

function showSpeedAnswer(){
  if(practiceSubmitted)return;
  const q=getCurrentQuestion();
  if(!q)return;
  practiceTotal++;practiceSubmitted=true;
  const correctSet=new Set(q.correctAnswers);
  // count as wrong in speed mode
  document.querySelectorAll('#quizOptions .quiz-option').forEach(el=>{
    const k=el.dataset.key;
    el.classList.remove('selected');
    if(correctSet.has(k))el.classList.add('correct-highlight');
    el.style.cursor='default';el.onclick=null;
  });
  // Auto advance after feedback
  practiceAutoTimer=setTimeout(()=>{practiceAutoTimer=null;advanceQuestion();},300);
}

function skipQuestion() {
  var q = getCurrentQuestion();
  if (!q) return;
  if (!practiceSubmitted) {
    practiceSubmitted = true; practiceTotal++;
    document.querySelectorAll("#quizOptions .quiz-option").forEach(function(el) {
      el.style.cursor = "default"; el.onclick = null;
    });
    var sb = document.getElementById("submitBtn"); if (sb) sb.disabled = true;
    document.getElementById("quizResult").innerHTML = "<div class=\"quiz-result skipped\">\u23ed \u5df2\u8df3\u8fc7</div>";
    updateLiveScore();
  }
  advanceQuestion();
}function advanceQuestion(){
  stopAutoTimer();
  if(practiceMode==='exam'&&examTimeLeft<=0){renderPracticeFinish();return;}
  practiceIdx++;selectedOptions=[];
  const area=document.getElementById('practiceArea');
  if(area)area.innerHTML=renderPracticeQuestion();
  window.scrollTo({top:0,behavior:'smooth'});
}

function stopAutoTimer(){if(practiceAutoTimer){clearTimeout(practiceAutoTimer);practiceAutoTimer=null;}}
function updateLiveScore(){
  const lc=document.getElementById('liveCorrect');if(lc)lc.textContent=practiceCorrect;
  const lt=document.getElementById('liveTotal');if(lt)lt.textContent=practiceTotal;
}

function renderPracticeFinish(){
  stopAutoTimer();stopVoice();
  if(examTimer){clearInterval(examTimer);examTimer=null;}
  const pct=practiceTotal>0?Math.round(practiceCorrect/practiceTotal*100):0;
  let emoji='🎉',tip='干得漂亮！';
  if(pct<60){emoji='📚';tip='继续加油，多刷几遍！';}
  else if(pct<80){emoji='💪';tip='还不错，还有提升空间！';}
  else if(pct<100){emoji='🌟';tip='接近完美，查漏补缺！';}

  let h='<div class="card" style="text-align:center;padding:40px 20px">';
  h+='<div style="font-size:48px;margin-bottom:12px">'+emoji+'</div>';
  h+='<h2 style="font-size:20px;margin-bottom:8px">'+('全部完成！')+'</h2>';
  h+='<div style="font-size:40px;font-weight:800;color:#10b981;margin:16px 0">'+pct+'%</div>';
  h+='<p style="color:#6b7280;font-size:14px">正确 '+practiceCorrect+' / '+practiceTotal+' 题</p>';
  h+='<p style="color:#9ca3af;font-size:13px;margin-top:4px">'+tip+'</p>';
  h+='<div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">';
  h+='<button class="btn btn-primary" onclick="retryPractice()">再来一次</button>';
  if(wrongList.length>0)h+='<button class="btn btn-danger" onclick="switchPracticeMode(\'review\')">🔄 错题重做 ('+wrongList.length+')</button>';
  h+='<button class="btn btn-secondary" onclick="switchTab(\''+practiceMode+'\')">返回列表</button>';
  h+='</div></div>';
  return h;
}

function retryPractice(){
  stopVoice();stopAutoTimer();
  practiceIdx=0;practiceCorrect=0;practiceTotal=0;practiceSubmitted=false;
  if(practiceMode==='review')practiceOrder=buildReviewOrder();
  else practiceOrder=buildPracticeOrder(practiceMode!=='practice');
  if(practiceMode==='exam'){examTimeLeft=30*60;startExamTimer();}
  const area=document.getElementById('practiceArea');
  if(area)area.innerHTML=renderPracticeQuestion();
  window.scrollTo({top:0,behavior:'smooth'});
}

function nextPracticeQuestion(){
  if(!practiceSubmitted&&practiceMode==='exam'){
    // allow skipping without answering in exam mode
    practiceSubmitted=true;
    document.querySelectorAll('#quizOptions .quiz-option').forEach(el=>{el.style.cursor='default';el.onclick=null;});
    const sb=document.getElementById('submitBtn');if(sb)sb.disabled=true;
  }
  advanceQuestion();
}

function startExamTimer(){
  if(examTimer){clearInterval(examTimer);}
  examTimer=setInterval(()=>{
    examTimeLeft--;
    const el=document.getElementById('examTimer');
    if(el){
      const m=Math.floor(examTimeLeft/60),s=examTimeLeft%60;
      el.textContent='⏱ '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
      el.className='exam-timer';
      if(examTimeLeft<60)el.classList.add('danger');
      else if(examTimeLeft<300)el.classList.add('warning');
    }
    if(examTimeLeft<=0){
      clearInterval(examTimer);examTimer=null;
      // Force submit current question if not yet submitted
      if(!practiceSubmitted)submitAnswer();
      else{const area=document.getElementById('practiceArea');if(area)area.innerHTML=renderPracticeFinish();}
    }
  },1000);
}

function toggleVoice(){
  if(voiceSpeaking){stopVoice();return;}
  const q=getCurrentQuestion();
  if(!q){stopVoice();return;}
  speakQuestion(q);
}

// ─── INIT ───
function updateCounts(){
  document.getElementById('count-fullcorrect').textContent=questionsData.filter(q=>catOf(q)==='full').length;
  document.getElementById('count-mine').textContent=questionsData.filter(q=>catOf(q)==='mine').length;
  document.getElementById('count-twins').textContent=questionsData.filter(q=>catOf(q)==='twins').length;
  document.getElementById('count-three').textContent=questionsData.filter(q=>catOf(q)==='three').length;
}
updateCounts();
renderFullCorrect();
</script>
