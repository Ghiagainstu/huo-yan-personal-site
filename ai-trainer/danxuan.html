<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人工智能训练师 · 单选题 v14</title>
<style>
  :root {
    --bg: #f5f6fa;
    --card: #fff;
    --primary: #4f46e5;
    --success: #10b981;
    --danger: #ef4444;
    --text: #1e293b;
    --muted: #94a3b8;
    --border: #e2e8f0;
    --tag-bg: #eef2ff;
    --tag-text: #4f46e5;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  }
  * { margin:0; padding:0; box-sizing:border-box }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
  }
  .container { max-width:720px; margin:0 auto; padding:16px }
  header {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color:#fff; border-radius:14px; padding:20px 24px; margin-bottom:16px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px
  }
  header h1 { font-size:18px; font-weight:700 }
  .stats { display:flex; gap:12px; font-size:13px; background:rgba(255,255,255,.15); border-radius:8px; padding:8px 14px }
  .stat-item { text-align:center }
  .stat-item .num { font-size:18px; font-weight:700; display:block }
  .stat-item .label { font-size:11px; opacity:.8 }
  .stat-item .num.correct { color:#a7f3d0 }
  .stat-item .num.wrong { color:#fca5a5 }
  .stat-item .num.remain { color:#fde68a }
  .card {
    background:var(--card); border-radius:14px; padding:24px; box-shadow:var(--shadow);
    transition:border .2s; border:2px solid transparent; margin-bottom:16px
  }
  .q-num { font-size:12px; color:var(--muted); margin-bottom:8px }
  .q-text { font-size:16px; font-weight:500; margin-bottom:16px; line-height:1.7 }
  .opt-item {
    display:flex; align-items:flex-start; gap:10px; padding:10px 14px; margin-bottom:6px;
    border-radius:10px; border:1.5px solid var(--border); cursor:pointer;
    transition:all .15s; font-size:15px; user-select:none
  }
  .opt-item:hover { border-color:#a5b4fc; background:#f5f3ff }
  .opt-item.selected { border-color:var(--primary); background:#eef2ff }
  .opt-item.correct-highlight { border-color:var(--success); background:#ecfdf5 }
  .opt-item.wrong-highlight { border-color:var(--danger); background:#fef2f2 }
  .opt-item.missed-highlight { border-color:#f59e0b; background:#fffbeb }
  .opt-checkbox {
    width:20px; height:20px; flex-shrink:0; border:2px solid var(--border);
    border-radius:4px; display:flex; align-items:center; justify-content:center;
    transition:all .15s; margin-top:1px
  }
  .opt-item.selected .opt-checkbox { background:var(--primary); border-color:var(--primary); color:#fff }
  .opt-item.correct-highlight .opt-checkbox { background:var(--success); border-color:var(--success); color:#fff }
  .opt-item.wrong-highlight .opt-checkbox { background:var(--danger); border-color:var(--danger); color:#fff }
  .opt-item.missed-highlight .opt-checkbox { background:#f59e0b; border-color:#f59e0b; color:#fff }
  .opt-label { font-weight:600; min-width:20px; color:var(--muted) }
  .btn-row { display:flex; gap:10px; margin-top:18px }
  .btn-submit {
    flex:1; padding:12px; border:none; border-radius:10px; font-size:15px; font-weight:600;
    cursor:pointer; background:var(--primary); color:#fff; transition:opacity .15s
  }
  .btn-submit:disabled { opacity:.4; cursor:default }
  .btn-submit:not(:disabled):hover { opacity:.9 }
  .q-result { padding:12px 16px; border-radius:10px; margin-top:14px; display:none; font-size:14px; line-height:1.6 }
  .q-result.show { display:block }
  .q-tag { display:inline-block; padding:2px 10px; border-radius:4px; font-size:12px; font-weight:600; margin:0 2px }
  .q-tag.ans-true { background:#d1fae5; color:#065f46 }
  .q-tag.ans-false { background:#fee2e2; color:#991b1b }
  .nav { display:none; text-align:center; margin:16px 0 24px }
  .nav-inner { display:inline-flex; align-items:center; gap:12px }
  .nav-btn {
    padding:8px 18px; border:1.5px solid var(--border); border-radius:8px;
    background:var(--card); cursor:pointer; font-size:14px; font-weight:500; transition:all .15s
  }
  .nav-btn:hover { border-color:var(--primary); color:var(--primary) }
  .nav-btn:disabled { opacity:.4; cursor:default; border-color:var(--border); color:var(--muted) }
  .nav-pos { font-size:13px; color:var(--muted); min-width:60px }
  .progress-bar { height:6px; background:var(--border); border-radius:3px; margin:12px 0; overflow:hidden }
  .progress-fill { height:100%; background:linear-gradient(90deg, var(--primary), #7c3aed); border-radius:3px; transition:width .3s; width:0 }
  .progress-text { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:12px }
  .finish-panel {
    text-align:center; padding:40px 20px; background:var(--card);
    border-radius:14px; box-shadow:var(--shadow)
  }
  .finish-panel .big-icon { font-size:56px; margin-bottom:12px }
  .finish-panel h2 { margin-bottom:8px }
  .finish-panel .score { font-size:48px; font-weight:800; margin:16px 0 4px }
  .finish-panel .detail { color:var(--muted); font-size:14px; margin-bottom:24px }
  .finish-panel .btn { max-width:280px; margin:8px auto }
  .summary-table {
    width:100%; border-collapse:collapse; font-size:14px; margin-top:12px
  }
  .summary-table th, .summary-table td {
    padding:8px 10px; text-align:left; border-bottom:1px solid var(--border)
  }
  .summary-table th { font-weight:600; color:var(--muted); font-size:12px }
  .summary-row:hover { background:#f8fafc }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px }
  .dot.green { background:var(--success) }
  .dot.red { background:var(--danger) }
  #historyBar {
    text-align:center; margin:8px 0 16px; display:none; cursor:pointer;
    color:var(--primary); font-size:13px; font-weight:500
  }
  #historyBar:hover { text-decoration:underline }
  .history-entry { background:var(--bg); border-radius:8px; padding:12px; margin-bottom:10px; text-align:left; font-size:13px }
  .toggle-btn {
    border:none; background:transparent; color:var(--primary); cursor:pointer; font-size:13px; font-weight:500; padding:4px 0
  }

  .cat-bar { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:12px 0 }
  .cat-btn { padding:5px 14px; border-radius:20px; border:1.5px solid var(--border); background:var(--card); color:var(--text); font-size:12px; cursor:pointer; transition:all 0.2s; white-space:nowrap }
  .cat-btn:hover { border-color:var(--primary); color:var(--primary) }
  .cat-btn.active { background:var(--primary); color:#fff; border-color:var(--primary) }
  .cat-count { font-size:10px; opacity:0.7; margin-left:2px }
  


/* ═══ V10: Dark ═══ */
.dark-toggle { border: none; background: transparent; cursor: pointer; font-size: 18px; padding: 4px 8px; border-radius: 6px; transition: all .15s }
.dark-toggle:hover { background: rgba(255,255,255,.2) }
body.dark-mode { --bg: #0f172a; --card: #1e293b; --primary: #818cf8; --success: #34d399; --danger: #f87171; --text: #e2e8f0; --muted: #94a3b8; --border: #334155; --tag-bg: #312e81; --tag-text: #a5b4fc; --shadow: 0 1px 3px rgba(0,0,0,.3) }
body.dark-mode .opt-item:hover { background: #1e293b }
body.dark-mode .opt-item.selected { background: #312e81 }
body.dark-mode .opt-item.correct-highlight { background: #064e3b }
body.dark-mode .opt-item.wrong-highlight { background: #451a1a }
body.dark-mode .cat-btn { background: #1e293b }
body.dark-mode .cat-btn:hover { border-color: #818cf8 }
body.dark-mode .history-entry { background: #1e293b }
body.dark-mode input, body.dark-mode select { background: #1e293b; color: #e2e8f0; border-color: #334155 }

/* ═══ V10: Favorites ═══ */
.fav-star { cursor: pointer; font-size: 20px; transition: transform .15s; display: inline-block; margin-left: 6px; user-select: none }
.fav-star:hover { transform: scale(1.3) }
.fav-star.active { color: #f59e0b }
.fav-star.inactive { color: var(--muted) }
.fav-badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; background: #fef3c7; color: #92400e; cursor: pointer; margin-left: 6px; transition: all .15s; border: none; font-family: inherit; font-weight: 500 }
.fav-badge:hover { background: #fde68a }
body.dark-mode .fav-badge { background: #78350f; color: #fde68a }

/* ═══ V10: Exam ═══ */
.exam-overlay, .plan-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.7); z-index: 999; align-items: center; justify-content: center; padding: 20px; overflow-y: auto }
.exam-overlay.show, .plan-overlay.show { display: flex }
.exam-card { background: var(--card); border-radius: 16px; padding: 28px; max-width: 440px; width: 100%; text-align: center }
.exam-timer { font-size: 48px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 12px 0; color: var(--primary) }
.exam-timer.warning { color: #f59e0b }
.exam-timer.danger { color: var(--danger); animation: pulse 1s infinite }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .5 } }
.exam-progress { font-size: 14px; color: var(--muted); margin-bottom: 16px }
.exam-stats { display: flex; justify-content: center; gap: 16px; margin: 12px 0; font-size: 14px }

/* ═══ V10: 25-Day Plan ═══ */
.plan-card { background: var(--card); border-radius: 16px; padding: 24px; max-width: 560px; width: 100%; max-height: 85vh; overflow-y: auto; margin: 20px }
.plan-card h2 { font-size: 20px; margin-bottom: 4px; text-align: center }
.plan-card .sub { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 16px }
.plan-day-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 12px 0 }
.plan-day { aspect-ratio: 1; border-radius: 10px; border: 1.5px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all .15s; font-size: 12px; font-weight: 600 }
.plan-day:hover { border-color: var(--primary); background: #f5f3ff }
.plan-day.done { background: #ecfdf5; border-color: var(--success); color: #065f46 }
.plan-day.today { border-color: var(--primary); border-width: 3px; background: #eef2ff }
.plan-day.locked { opacity: .4; cursor: not-allowed }
body.dark-mode .plan-day:hover { background: #1e293b }
body.dark-mode .plan-day.done { background: #064e3b; color: #34d399 }
body.dark-mode .plan-day.today { background: #312e81 }
.plan-day .day-num { font-size: 16px; font-weight: 700 }
.plan-stats { display: flex; justify-content: center; gap: 20px; margin: 16px 0; font-size: 14px }
.plan-stats strong { font-size: 20px }
.plan-detail { background: var(--bg); border-radius: 10px; padding: 14px; margin-top: 12px; font-size: 13px; line-height: 1.6 }
.non-unique-tag { display:inline-block; font-size:11px; padding:2px 8px; border-radius:4px; background:#fef3c7; color:#92400e; font-weight:600; margin-left:6px; vertical-align:middle }

#persistentTools button:hover { opacity:0.85; filter:brightness(0.95); }
#persistentTools button:active { transform:scale(0.97); }
@media (max-width:500px) { #persistentTools button { font-size:12px; padding:6px 12px; } }
</style>

<body>
<div class="container" id="app">
  <header>
    <div>
      <h1>📝 单选题练习</h1>
      <div style="font-size:12px;opacity:.8;margin-top:2px">共 600 题 · 选择一个正确答案</div>
    </div>
    <div class="stats">
      <div class="stat-item"><span class="num correct" id="correctCount">0</span><span class="label">正确</span></div>
      <div class="stat-item"><span class="num wrong" id="wrongCount">0</span><span class="label">错误</span></div>
      <div class="stat-item"><span class="num remain" id="remainCount">600</span><span class="label">剩余</span></div>
      <div class="stat-item"><span class="num" id="scorePercent" style="color:#fff">-</span><span class="label">正确率</span></div>
    </div>
  
    <button class="fav-badge" id="favBadge" onclick="toggleFavMode()" style="display:none">⭐ 收藏 (<span id="favCount">0</span>)</button>
    <button class="dark-toggle" id="darkBtn" onclick="toggleDarkMode()" title="深色模式">🌙</button>
    <button class="dark-toggle" onclick="startExam()" title="模拟考试">📝</button>
  </header>

  <div style="display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:12px;color:var(--muted)" id="roundBadge">第 1 轮</span>
    <button onclick="if(confirm('确定要重置所有进度吗？'))resetAll()" style="font-size:12px;padding:4px 14px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--danger);cursor:pointer;transition:all .15s" onmouseover="this.style.background='#fef2f2'" onmouseout="this.style.background='var(--card)'">&#x1f504; 重置进度</button> <button onclick="openPlan()" style="font-size:12px;padding:4px 14px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:#059669;cursor:pointer;transition:all .15s" onmouseover="this.style.background='#ecfdf5'" onmouseout="this.style.background='var(--card)'">📅 25天计划</button> <button onclick='openUniqueAnswerList()' style='font-size:12px;padding:4px 14px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:#7c3aed;cursor:pointer;transition:all .15s' onmouseover='this.style.background="#f5f3ff"' onmouseout='this.style.background="var(--card)"'>💎 唯一答案列表</button>
   <button onclick="toggleHistory()" style="padding:8px 16px;border:1.5px solid #ef4444;border-radius:8px;background:var(--card);color:#ef4444;font-size:13px;font-weight:600;cursor:pointer" id="tbWrong">❌ 错题回顾 (<span id="tbWrongCount">0</span>)</button> <button onclick="toggleFavMode()" style="padding:8px 16px;border:1.5px solid #f59e0b;border-radius:8px;background:var(--card);color:#f59e0b;font-size:13px;font-weight:600;cursor:pointer" id="tbFav">⭐ 收藏 (<span id="tbFavCount">0</span>)</button></div>

  <div class="progress-text">
    <span id="progressCur">0 / 0</span>
    <span id="progressPct">0%</span>
  </div>
        <div class="cat-bar" id="catBar">
      <button class="cat-btn active" onclick="selectCategory('all')" id="cat-all">📚 全部 <span class="cat-count">600</span></button>
      <button class="cat-btn" onclick="selectCategory('职业道德与职业守则')" id="cat-职业道德与职业守则">📖 职业道德与职业守则 <span class="cat-count">34</span></button>
      <button class="cat-btn" onclick="selectCategory('计算机基础操作')" id="cat-计算机基础操作">📖 计算机基础操作 <span class="cat-count">51</span></button>
      <button class="cat-btn" onclick="selectCategory('法律法规与合规')" id="cat-法律法规与合规">📖 法律法规与合规 <span class="cat-count">36</span></button>
      <button class="cat-btn" onclick="selectCategory('数据采集与处理')" id="cat-数据采集与处理">📖 数据采集与处理 <span class="cat-count">130</span></button>
      <button class="cat-btn" onclick="selectCategory('数据分析与可视化')" id="cat-数据分析与可视化">📖 数据分析与可视化 <span class="cat-count">42</span></button>
      <button class="cat-btn" onclick="selectCategory('数据标注')" id="cat-数据标注">📖 数据标注 <span class="cat-count">20</span></button>
      <button class="cat-btn" onclick="selectCategory('模型训练与评估')" id="cat-模型训练与评估">📖 模型训练与评估 <span class="cat-count">127</span></button>
      <button class="cat-btn" onclick="selectCategory('AI业务与流程')" id="cat-AI业务与流程">📖 AI业务与流程 <span class="cat-count">50</span></button>
      <button class="cat-btn" onclick="selectCategory('云服务与安全')" id="cat-云服务与安全">📖 云服务与安全 <span class="cat-count">41</span></button>
      <button class="cat-btn" onclick="selectCategory('知识表示与机器学习')" id="cat-知识表示与机器学习">📖 知识表示与机器学习 <span class="cat-count">11</span></button>
      <button class="cat-btn" onclick="selectCategory('交互与产品设计')" id="cat-交互与产品设计">📖 交互与产品设计 <span class="cat-count">58</span></button>
    </div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div id="historyBar" onclick="toggleHistory()">📊 查看各轮错题回顾（<span id="historyCount">0</span>轮）</div>

  
<div id="questionArea"></div>

  <div class="nav" id="qNav">
    <div class="nav-inner">
      <button class="nav-btn" id="prevBtn" onclick="goToQuestion(currentIndex-1)">◀ 上一题</button>
      <span class="nav-pos" id="navPos"></span>
      <button class="nav-btn" id="nextBtn" onclick="goToQuestion(currentIndex+1)">下一题 ▶</button>
    </div>
  </div>
</div>

<div class="exam-overlay" id="examOverlay">
  <div class="exam-card" id="examCard">
    <h2>📝 模拟考试</h2>
    <div class="exam-timer" id="examTimer">90:00</div>
    <div class="exam-progress" id="examProgress">已答 0 / <span id="examTotal">0</span></div>
    <div class="exam-stats"><span>✅ <strong id="examCorrect">0</strong></span><span>❌ <strong id="examWrong">0</strong></span></div>
    <p style="font-size:13px;color:var(--muted);margin-bottom:8px">选择考试范围：</p>
    <select id="examCategory" style="padding:8px 12px;border-radius:8px;border:1.5px solid var(--border);font-size:14px;width:100%" onchange="updateExamTotal()">
      <option value="all">全部题目</option>
    </select>
    <div style="margin-top:12px">
      <button class="btn-submit" id="examStartBtn" onclick="beginExam()">开始考试（90分钟）</button>
      <button class="btn-submit" id="examSubmitBtn" onclick="submitExam()" style="display:none;background:var(--danger)">交卷</button>
    </div>
    <button class="nav-btn" onclick="closeExam()" style="margin-top:8px">取消</button>
  </div>
</div>
<div class="plan-overlay" id="planOverlay">
  <div class="plan-card">
    <h2>📅 25天刷题计划</h2>
    <p class="sub">基于艾宾浩斯遗忘曲线 · 每日24题新题+复习</p>
    <div class="plan-stats">
      <div>📅 已完成<br><strong id="planDaysDone">0</strong>/25天</div>
      <div>📝 已练<br><strong id="planQsDone">0</strong>/600题</div>
      <div>📊 正确率<br><strong id="planAccuracy">-</strong></div>
    </div>
    <div class="plan-day-grid" id="planDayGrid"></div>
    <div class="plan-detail" id="planDetail" style="text-align:center;color:var(--muted)">👆 点击日期查看详情并开始练习</div>
    <div style="text-align:center;margin-top:16px">
      <button class="btn-submit" id="planStartTodayBtn" onclick="startPlanToday()" style="max-width:200px">▶️ 开始今日任务</button>
    </div>
    <button class="nav-btn" onclick="closePlan()" style="width:100%;margin-top:8px">关闭</button>
  </div>

function hideQuestion(id) {
  if (!confirm('确定隐藏第 ' + id + ' 题？隐藏后刷题将自动跳过此题。')) return;
  hiddenIds.add(id);
  localStorage.setItem('ai_trainer_hidden', JSON.stringify([].slice.call(hiddenIds)));
  // 从当前池移除并进入下一题
  var idx = currentPool.findIndex(function(q) { return q.id === id; });
  if (idx >= 0) {
    currentPool.splice(idx, 1);
    if (idx < currentIndex) currentIndex--;
    if (currentIndex >= currentPool.length) { showRoundFinish(); return; }
  }
  saveProgress();
  renderQuestion();
  updateStats();
  updateProgress();
  renderNav();
}

var activeCategory = 'all';

function selectCategory(cat) {
  if (autoAdvancing) return;
  if (cat === activeCategory) return;
  activeCategory = cat;
  var btns = document.querySelectorAll('.cat-btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  var ab = document.getElementById('cat-' + cat);
  if (ab) ab.classList.add('active');
  if (cat === 'all') {
    currentPool = allQuestions.slice();
    sortByCategory(currentPool);
  } else {
    currentPool = [];
    for (var fi = 0; fi < allQuestions.length; fi++) { if (QCATEGORIES[allQuestions[fi].id] === cat) currentPool.push(allQuestions[fi]); }
    sortByCategory(currentPool);
  }
  // 如果正在做错题模式，过滤只保留错题
  if (globalWrongIds && globalWrongIds.size > 0) {
    currentPool = currentPool.filter(function(q) { return globalWrongIds.has(q.id); });
  }
  currentPool = currentPool.filter(function(q) { return !hiddenIds.has(q.id); });
  if (currentPool.length === 0) {
    document.getElementById('questionArea').innerHTML = '<div class="finish-panel"><div class="big-icon">\u{1f3c6}</div><h2>该分类已全部掌握！</h2><p style="color:var(--muted)">换个分类或\"全部\"继续练习</p></div>';
    document.getElementById('qNav').style.display = 'none';
    return;
  }
  var doneIds = {};
  for (var di = 0; di < roundResults.length; di++) {
    if (currentPool.some(function(q) { return q.id === roundResults[di].id; }))
      doneIds[roundResults[di].id] = true;
  }
  currentIndex = 0;
  for (var pi = 0; pi < currentPool.length; pi++) {
    if (!doneIds[currentPool[pi].id]) { currentIndex = pi; break; }
    currentIndex = pi + 1;
  }
  if (currentIndex >= currentPool.length) {
    // All questions in this category done — compute finish panel from current pool
    var poolIds = {}; for (var pi = 0; pi < currentPool.length; pi++) poolIds[currentPool[pi].id] = true;
    var poolResults = roundResults.filter(function(r) { return poolIds[r.id]; });
    var lastResult = {};
    for (var pri = 0; pri < poolResults.length; pri++) { lastResult[poolResults[pri].id] = poolResults[pri]; }
    var qids = Object.keys(lastResult);
    var correct = 0; for (var qi = 0; qi < qids.length; qi++) { if (lastResult[qids[qi]].correct) correct++; }
    var wrong = qids.length - correct;
    var pct = currentPool.length > 0 ? Math.round(correct / currentPool.length * 100) : 0;
    var emoji = pct === 100 ? '\u{1f389}' : pct >= 80 ? '\u{1f60a}' : pct >= 60 ? '\u{1f4aa}' : '\u{1f4da}';
    var msg = pct === 100 ? '\u592a\u68d2\u4e86\uff0c\u5168\u90e8\u6b63\u786e\uff01' : pct >= 80 ? '\u4e0d\u9519\uff0c\u7ee7\u7eed\u4fdd\u6301\uff01' : pct >= 60 ? '\u8fd8\u9700\u52aa\u529b\uff0c\u52a0\u6cb9\uff01' : '\u591a\u52a0\u7ec3\u4e60\uff0c\u4f60\u53ef\u4ee5\u7684\uff01';
    var wrongIds = []; for (var w in lastResult) { if (!lastResult[w].correct) wrongIds.push(parseInt(w)); }
    var wrongItems = wrongIds.map(function(id) { var qq = allQuestions.find(function(x){return x.id===id}); return {id:id, text:qq?qq.text.substring(0,50)+(qq.text.length>50?'...':''):''}; });
    var finishData = { roundNumber: roundNumber, correct: correct, wrong: wrong, pct: pct, total: currentPool.length, emoji: emoji, msg: msg, hasWrong: wrong > 0, allClear: false, wrongItems: wrongItems };
    renderFinishPanel(finishData);
    return;
  }
  reviewingRound = 0; resumedMidRound = false;
  selectedOptions = []; submitted = false;
  saveProgress();
  var badgeEl = document.getElementById('roundBadge');
  if (badgeEl) badgeEl.textContent = cat === 'all' ? '第 ' + roundNumber + ' 轮' : cat + ' · ' + currentPool.length + ' 题';
  renderQuestion(); updateStats(); updateProgress(); renderNav();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function init() {
  // 版本迁移：兼容旧版数据
  var ver = localStorage.getItem('ai_trainer2_version');
  if (ver !== '2') {
    // 从旧 key 迁移数据，不清空
    var oldRH = localStorage.getItem('ai_trainer_round_history');
    if (oldRH) { localStorage.setItem('ai_trainer2_round_history', oldRH); }
    var oldR = localStorage.getItem('ai_trainer_round');
    if (oldR) { localStorage.setItem('ai_trainer2_round', oldR); }
    localStorage.setItem('ai_trainer2_version', '2');
  }
  loadFromStorage();
  updateToolbar();
  // V13 fix: restore category view BEFORE checking savedFinish
  if (typeof activeCategory !== 'undefined' && activeCategory !== 'all') {
    selectCategory(activeCategory);
    return;
  }
  updateToolbar();
  var savedFinish = localStorage.getItem('ai_trainer2_finish_single');
  if (savedFinish) {
    try {
      var data = JSON.parse(savedFinish);
      snapshotPreRoundWrongIds = globalWrongIds ? new Set(globalWrongIds) : null;
      snapshotPreRoundNumber = data.roundNumber;
      renderFinishPanel(data);
      return;
    } catch(e) {}
  }
  if (currentPool.length > 0 && roundResults.length > 0) {
    resumedMidRound = true;
  }
  if (currentPool.length > 0 && roundResults.length > 0) {
    if (currentIndex >= currentPool.length) currentIndex = 0;
    updateStats(); updateProgress(); renderNav(); renderQuestion();
  } else {
    startNewRound();
  }
  updateToolbar();
}
function loadFromStorage() {
  try {
    var raw = localStorage.getItem('ai_trainer2_wrong_ids');
    if (raw) globalWrongIds = new Set(JSON.parse(raw));
    var r = localStorage.getItem('ai_trainer2_round') || localStorage.getItem('ai_trainer_round');
    if (r) roundNumber = parseInt(r) || 1;
    var poolOrder = localStorage.getItem('ai_trainer2_pool_order');
    var results = localStorage.getItem('ai_trainer2_round_results');
    var idx = localStorage.getItem('ai_trainer2_current_index');
    if (poolOrder) {
      var ids = JSON.parse(poolOrder);
      currentPool = ids.map(function(id) { return allQuestions.find(function(q) { return q.id === id; }); }).filter(Boolean);
    }
    if (results) roundResults = JSON.parse(results);
    if (idx !== null) currentIndex = parseInt(idx) || 0;
    var rh = localStorage.getItem('ai_trainer2_round_history') || localStorage.getItem('ai_trainer_round_history');
    if (rh) { roundHistory = JSON.parse(rh); saveToStorage(); }
    var ac = localStorage.getItem('ai_trainer2_active_category');
    if (ac) activeCategory = ac;
    // Load favorites
    var fv = localStorage.getItem('ai_trainer_fav') || localStorage.getItem('ai_trainer_favorites');
    if (fv && typeof _favs !== 'undefined') {
      try { _favs = new Set(JSON.parse(fv)); } catch(e) {}
    if (fv) { localStorage.setItem('ai_trainer_fav', fv); localStorage.removeItem('ai_trainer_favorites'); }
    }
    // Load hidden
    var hd = localStorage.getItem('ai_trainer_hidden');
    if (hd && typeof hiddenIds !== 'undefined') {
      try { hiddenIds = new Set(JSON.parse(hd)); } catch(e) {}
    }
  } catch(e) { currentPool = []; roundResults = []; currentIndex = 0; }
}

function saveToStorage() {
  // v14: also persist roundResults so refresh doesn't lose progress
  try { localStorage.setItem('ai_trainer2_round_results', JSON.stringify(roundResults)); } catch(e) {}
  localStorage.setItem('ai_trainer2_active_category', activeCategory);
  if (globalWrongIds && globalWrongIds.size > 0) {
    localStorage.setItem('ai_trainer2_wrong_ids', JSON.stringify([].slice.call(globalWrongIds)));
  } else {
    localStorage.removeItem('ai_trainer2_wrong_ids');
  }
  localStorage.setItem('ai_trainer2_round', roundNumber);
  if (roundHistory.length > 0) {
    localStorage.setItem('ai_trainer2_round_history', JSON.stringify(roundHistory));
  }
}

function saveProgress() {
  saveToStorage();
  try {
    localStorage.setItem('ai_trainer2_pool_order', JSON.stringify(currentPool.map(function(q) { return q.id; })));
    localStorage.setItem('ai_trainer2_round_results', JSON.stringify(roundResults));
    localStorage.setItem('ai_trainer2_current_index', currentIndex);
  } catch(e) {}
}

function clearCurrentProgress() {
  localStorage.removeItem('ai_trainer2_pool_order');
  localStorage.removeItem('ai_trainer2_round_results');
  localStorage.removeItem('ai_trainer2_current_index');
}

function clearStorage() {
  localStorage.removeItem('ai_trainer_hidden');
  localStorage.removeItem('ai_trainer_fav');
  localStorage.removeItem('ai_trainer2_wrong_ids');
  localStorage.removeItem('ai_trainer2_round');
  localStorage.removeItem('ai_trainer2_pool_order');
  localStorage.removeItem('ai_trainer2_round_results');
  localStorage.removeItem('ai_trainer2_current_index');
  localStorage.removeItem('ai_trainer2_finish_single');
  localStorage.removeItem('ai_trainer2_round_history');
  localStorage.removeItem('ai_trainer2_active_category');
  roundHistory = [];
}

function startNewRound() {
  if (resumedMidRound && currentPool.length > 0 && currentIndex < currentPool.length) {
    resumedMidRound = false;
    if (roundResults.length >= currentPool.length) { showRoundFinish(); return; }
    renderQuestion(); updateStats(); updateProgress(); renderNav();
    return;
  }
  resumedMidRound = false;
  var pool;
  if (globalWrongIds && globalWrongIds.size > 0) {
    pool = allQuestions.filter(function(q) { return globalWrongIds.has(q.id); });
  } else {
    pool = [].concat(allQuestions);
  }
  // 过滤隐藏题
  pool = pool.filter(function(q) { return !hiddenIds.has(q.id); });
  // shuffle
  sortByCategory(pool);
  currentPool = pool;
  currentIndex = 0;
  roundResults = [];
  selectedOptions = [];
  submitted = false;
  if (currentPool.length === 0) { showAllClear(); return; }
  document.getElementById('roundBadge').textContent = '第 ' + roundNumber + ' 轮';
  renderQuestion(); updateStats(); updateProgress(); renderNav();
  saveToStorage();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function toggleOption(idx) {
  if (submitted) return;
  // 单选：点击选中，再次点击取消
  if (selectedOptions.length === 1 && selectedOptions[0] === idx) {
    selectedOptions = [];
  } else {
    selectedOptions = [idx];
  }
  updateOptionStyles();
}

function updateOptionStyles() {
  var q = currentPool[currentIndex];
  if (!q) return;
  for (var i = 0; i < q.options.length; i++) {
    var el = document.getElementById('opt-' + i);
    if (!el) continue;
    if (selectedOptions.length > 0 && selectedOptions[0] === i) el.classList.add('selected');
    else el.classList.remove('selected');
  }
}

function handleSubmitOrNext() {
  var btn = document.getElementById('submitBtn');
  if (btn && btn.getAttribute('data-next') === '1') {
    btn.removeAttribute('data-next');
    if (currentIndex >= currentPool.length - 1) { showRoundFinish(); }
    else { currentIndex++; renderQuestion(); saveProgress(); renderNav(); window.scrollTo({ top:0, behavior:'smooth' }); }
    return;
  }
  submitAnswer();
}

function submitAnswer() {
  if (submitted) return;
  if (selectedOptions.length === 0) return;
  submitted = true;

  var q = currentPool[currentIndex];
  var correctAns = q.answer[0];  // 单选：取第一个元素
  var isCorrect = selectedOptions.length > 0 && selectedOptions[0] === correctAns;

  roundResults.push({ id: q.id, correct: isCorrect, selected: selectedOptions.slice() });
  updateStats(); updateProgress(); saveProgress(); renderNav();

  if (isCorrect) {
    // 选对：短暂高亮绿色后再跳下一题
    var selEl = document.getElementById('opt-' + selectedOptions[0]);
    if (selEl) { selEl.classList.remove('selected'); selEl.classList.add('correct-highlight'); }
    var resEl = document.getElementById('qResult');
    if (resEl) {
      resEl.className = 'q-result show';
      resEl.style.background = '#ecfdf5';
      resEl.style.color = '#065f46';
      resEl.innerHTML = '&#x2705; <b>回答正确！</b>';
    }
    var btnEl = document.getElementById('submitBtn');
    if (btnEl) { btnEl.disabled = true; btnEl.textContent = '正确，即将跳转...'; }
    autoAdvancing = true;
    setTimeout(function() {
      autoAdvancing = false;
      if (currentIndex >= currentPool.length - 1) { showRoundFinish(); }
      else { currentIndex++; saveProgress(); renderQuestion(); }
    }, 400);
  } else {
    // 选错：停留，高亮正确/错误选项，显示结果
    for (var i = 0; i < q.options.length; i++) {
      var el = document.getElementById('opt-' + i);
      if (!el) continue;
      el.classList.remove('selected');
      if (i === correctAns) el.classList.add('correct-highlight');
      else if (selectedOptions.length > 0 && selectedOptions[0] === i) el.classList.add('wrong-highlight');
    }
    var result = document.getElementById('qResult');
    if (result) {
      result.className = 'q-result show';
      result.style.background = '#fef2f2';
      result.style.color = '#991b1b';
      var correctLabel = String.fromCharCode(65 + correctAns);
      var correctText = escapeHtml(q.options[correctAns]);
      var yourLabel = selectedOptions.length > 0 ? String.fromCharCode(65 + selectedOptions[0]) : '(未选)';
      result.innerHTML = '&#x274c; <b>回答错误！</b><br>'
        + '<span style="font-size:13px">你的答案：<span class="q-tag ans-false">' + yourLabel + '</span></span> '
        + '<span style="font-size:13px">正确答案：<span class="q-tag ans-true" style="font-size:14px;padding:3px 12px">' + correctLabel + '. ' + correctText + '</span></span>';
    }
    document.getElementById('submitBtn').textContent = '下一题 \u25b6';
    document.getElementById('submitBtn').setAttribute('data-next', '1');
  }
}

    + '<span class="nav-pos">' + (currentIndex+1) + ' / ' + total + '</span>'
    + '<button class="nav-btn"' + (hasNext?'':' disabled') + ' onclick="goToQuestion(' + (currentIndex+1) + ')">下一题 &#x25b6;</button></div>';

function goToQuestion(idx) {
  if (autoAdvancing) return;
  if (idx < 0 || idx >= currentPool.length) return;
  currentIndex = idx;
  renderQuestion();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function updateStats() {
  var lastResult = {};
  for (var ri = 0; ri < roundResults.length; ri++) {
    lastResult[roundResults[ri].id] = roundResults[ri];
  }
  var doneIds = {};
  for (var di = 0; di < roundResults.length; di++) doneIds[roundResults[di].id] = true;
  var correct = 0, wrong = 0, done = 0;
  for (var pi = 0; pi < currentPool.length; pi++) {
    var id = currentPool[pi].id;
    if (!lastResult.hasOwnProperty(id)) continue;
    done++;
    if (lastResult[id].correct) correct++; else wrong++;
  }
  var remain = currentPool.length - done;
  var pct = done > 0 ? Math.round(correct / done * 100) : '-';
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('remainCount').textContent = remain;
  document.getElementById('scorePercent').textContent = (pct === '-' ? '-' : pct + '%');
  var hb = document.getElementById('historyBar');
  if (hb) hb.style.display = (roundHistory.length > 0) ? 'block' : 'none';
  var hc = document.getElementById('historyCount');
  if (hc) hc.textContent = roundHistory.length;
}
function updateToolbar() {
  // wrong count
  var wc = document.getElementById('tbWrong');
  var wcCount = document.getElementById('tbWrongCount');
  if (!wc || !wcCount) return;
  if (roundHistory.length > 0) {
    var merged = new Set();
    for (var i = 0; i < roundHistory.length; i++) {
      for (var j = 0; j < roundHistory[i].wrongIds.length; j++) {
        merged.add(roundHistory[i].wrongIds[j]);
      }
    }
    wcCount.textContent = merged.size;
  }

  // fav count
  var fc = document.getElementById('tbFav');
  var fcCount = document.getElementById('tbFavCount');
  if (!fc || !fcCount) return;
  if (_favs && _favs.size > 0) {
    fcCount.textContent = _favs.size;
  }
}
function updateProgress() {
  var doneIds = {};
  for (var di = 0; di < roundResults.length; di++) doneIds[roundResults[di].id] = true;
  var done = 0;
  for (var pi = 0; pi < currentPool.length; pi++) {
    if (doneIds[currentPool[pi].id]) done++;
  }
  var total = currentPool.length;
  var pct = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressCur').textContent = done + ' / ' + total;
  document.getElementById('progressPct').textContent = pct + '%';
}function showRoundFinish() {
  var poolIds = {};
  for (var pi = 0; pi < currentPool.length; pi++) poolIds[currentPool[pi].id] = true;
  var poolResults = roundResults.filter(function(r) { return poolIds[r.id]; });
  // Deduplicate: keep only LAST result per question
  var lastResult = {};
  for (var pri = 0; pri < poolResults.length; pri++) {
    lastResult[poolResults[pri].id] = poolResults[pri];
  }
  var correct = 0, wrong = 0;
  var questionIds = [];
  for (var qid2 in lastResult) { if (lastResult.hasOwnProperty(qid2)) questionIds.push(qid2); }
  for (var qi = 0; qi < questionIds.length; qi++) {
    if (lastResult[questionIds[qi]].correct) correct++; else wrong++;
  }
  var total = currentPool.length;
  var pct = total > 0 ? Math.round(correct / total * 100) : 0;
  snapshotPreRoundWrongIds = globalWrongIds ? new Set(globalWrongIds) : null;
  snapshotPreRoundNumber = roundNumber;
  updateStats(); updateProgress();
  // Deduplicate wrongIds too
  var wrongSet = {};
  for (var wi = 0; wi < questionIds.length; wi++) {
    if (!lastResult[questionIds[wi]].correct) wrongSet[parseInt(questionIds[wi])] = true;
  }
  var wrongIds = [];
  for (var w in wrongSet) { if (wrongSet.hasOwnProperty(w)) wrongIds.push(parseInt(w)); }
  if (!reviewingRound) {
    roundHistory.push({ round: roundNumber, correct: correct, wrong: wrong, pct: pct, wrongIds: wrongIds });
  }
  globalWrongIds = new Set();
  for (var gi = 0; gi < roundHistory.length; gi++) {
    for (var gj = 0; gj < roundHistory[gi].wrongIds.length; gj++) {
      globalWrongIds.add(roundHistory[gi].wrongIds[gj]);
    }
  }
  saveToStorage();
  updateStats();

  var emoji = pct === 100 ? '&#x1f389;' : pct >= 80 ? '&#x1f60a;' : pct >= 60 ? '&#x1f4aa;' : '&#x1f4da;';
  var msg = pct === 100 ? '太棒了，全部正确！' : pct >= 80 ? '不错，继续保持！' : pct >= 60 ? '还需努力，加油！' : '多加练习，你可以的！';

  var finishData = { roundNumber: roundNumber, correct: correct, wrong: wrong, pct: pct, total: total, emoji: emoji, msg: msg, hasWrong: wrong > 0, allClear: false };
  if (wrong > 0) {
    finishData.wrongItems = [];
    for (var wf = 0; wf < wrongIds.length; wf++) {
      var q = allQuestions.find(function(x) { return x.id === wrongIds[wf]; });
      if (q) finishData.wrongItems.push({ id: wrongIds[wf], text: q.text.substring(0, 50) + (q.text.length > 50 ? '...' : '') });
    }
  }
  var storageKey = 'ai_trainer2_finish_single';
  localStorage.setItem(storageKey, JSON.stringify(finishData));
  // Preserve roundResults & pool order so refresh doesn't lose progress
  // Only clear currentIndex (reset position for next round)
  localStorage.removeItem('ai_trainer2_current_index');
  if (!globalWrongIds || globalWrongIds.size === 0) finishData.allClear = true;
  renderFinishPanel(finishData);

var Q_PER_DAY = 24, TOTAL_DAYS = 25, REVIEW_INTERVALS = [1, 2, 4, 7, 15];
function loadPlan() { try { var r = localStorage.getItem('ai_trainer_plan'); return r ? JSON.parse(r) : {}; } catch(e) { return {}; } }

  var doneD = 0, doneQ = 0, tc = 0, td = 0;
  var html = '';

    var key = getPlanDayKey(d), dd = plan[key];
    var done = !!(dd && dd.done);
    if (done) { doneD++; doneQ += Q_PER_DAY; if (dd.correct !== undefined && dd.total !== undefined) { tc += dd.correct; td += dd.total; } }
    var cls = 'plan-day';
    if (done) cls += ' done'; else if (d === today) cls += ' today'; else if (d > today) cls += ' locked';
    html += '<div class="' + cls + '" onclick="renderPlanDetail(' + d + ')"><span class="day-num">' + d + '</span>' + (done ? '<span style="font-size:10px">\u2705</span>' : (d === today ? '<span style="font-size:9px;opacity:.7">今日</span>' : '')) + '</div>';
  }

  document.getElementById('planQsDone').textContent = Math.min(doneQ, 600);

    var tkey = getPlanDayKey(today);
    btn.style.display = (plan[tkey] && plan[tkey].done) ? 'none' : 'block';

function renderPlanDetail(day) {
  if (day < 1 || day > TOTAL_DAYS) return;
  var plan = loadPlan(), dd = plan[getPlanDayKey(day)];
  var sid = (day - 1) * Q_PER_DAY + 1, eid = Math.min(day * Q_PER_DAY, 600);
  var revIds = [];
  REVIEW_INTERVALS.forEach(function(ri) {
    var rd = day - ri;
    if (rd >= 1) { var rs = (rd - 1) * Q_PER_DAY + 1, re = Math.min(rd * Q_PER_DAY, 600); for (var i = rs; i <= re; i++) revIds.push(i); }
  });
  var detail = document.getElementById('planDetail');
  if (!detail) return;
  var h = '<b>第 ' + day + ' 天</b> · <span style="color:var(--primary)">新题 ' + (eid - sid + 1) + ' 题</span>（题号 ' + sid + '-' + eid + '）';
  if (revIds.length > 0) h += ' <span style="color:#f59e0b">复习 ' + revIds.length + ' 题</span>';
  if (dd && dd.done) h += '<br>✅ 已完成 · 正确率 ' + (dd.total > 0 ? Math.round(dd.correct / dd.total * 100) : 0) + '%' + (dd.date ? '（' + dd.date + '）' : '');

function startPlanToday() { startPlanDay(planToday()); }
function startPlanDay(day) {
  var sid = (day - 1) * Q_PER_DAY + 1, eid = Math.min(day * Q_PER_DAY, 600);
  var pool = allQuestions.slice().filter(function(q){ return q.id >= sid && q.id <= eid; });
  REVIEW_INTERVALS.forEach(function(ri) {
    var rd = day - ri;
    if (rd >= 1) {
      var rs = (rd - 1) * Q_PER_DAY + 1, re = Math.min(rd * Q_PER_DAY, 600);
      pool = pool.concat(allQuestions.slice().filter(function(q){ return q.id >= rs && q.id <= re; }));
    }
  });
  sortByCategory(pool);
  var seen = {}, unique = [];
  for (var pi = 0; pi < pool.length; pi++) { if (!seen[pool[pi].id]) { seen[pool[pi].id] = true; unique.push(pool[pi]); } }
  pool = unique;
  currentPool = pool; currentIndex = 0; roundResults = []; selectedOptions = []; submitted = false;
  activeCategory = 'p' + day;
  var btns = document.querySelectorAll('.cat-btn'); for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  document.getElementById('roundBadge').textContent = '\ud83d\udcc5 第 ' + day + ' 天 · ' + pool.length + ' 题';

  for (var i = 0; i < list.length; i++) {
    var c = list[i].cat || '其他';
    if (!byCat[c]) byCat[c] = [];
    byCat[c].push(list[i]);
  }
  var cats = Object.keys(byCat).sort();
  
  var html = '<div id=\"uniqueAnswerPanel\" style=\"padding:20px 0\">';
  html += '<div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px\">';
  html += '<h2 style=\"margin:0;font-size:22px\">\ud83d\udc8e 唯一答案列表 <span style=\"font-size:14px;color:var(--muted)\">(共 ' + list.length + ' 题)</span></h2>';
  html += '<button onclick=\"closeUniqueAnswerList()\" style=\"padding:8px 20px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:14px\">\u2190 返回练习</button>';
  html += '</div>';
  html += '<p style=\"color:var(--muted);font-size:13px;margin-bottom:16px\">以下 ' + list.length + ' 道题的正确答案在整个题库中唯一，可直接背诵。点击返回按钮可回到正常练习。</p>';
  
  for (var ci = 0; ci < cats.length; ci++) {
    var cat = cats[ci];
    var items = byCat[cat];
    html += '<div style=\"margin-bottom:24px\">';
    html += '<h3 style=\"margin:0 0 10px 0;font-size:15px;color:var(--primary);border-bottom:1px solid var(--border);padding-bottom:6px\">' + cat + ' (' + items.length + '\u9898)</h3>';
    html += '<div style=\"display:grid;gap:6px\">';
    for (var j = 0; j < items.length; j++) {
      var item = items[j];
      html += '<div style=\"display:flex;gap:10px;padding:8px 12px;background:var(--card);border-radius:8px;border:1px solid var(--border);align-items:flex-start\">';
      html += '<span style=\"min-width:28px;color:var(--muted);font-size:12px\">#' + item.id + '</span>';
      html += '<div style=\"flex:1;min-width:0\">';
      html += '<div style=\"font-size:13px;line-height:1.5;margin-bottom:3px\">' + item.q + '</div>';
      html += '<div style=\"font-size:13px;font-weight:600;color:#059669\">\u7b54\u6848\uff1a' + item.ans + '</div>';
      html += '</div></div>';
    }
    html += '</div></div>';
  }
  html += '</div>';
  
  var area = document.getElementById('questionArea');
  if (area) area.innerHTML = html;
  var nav = document.getElementById('qNav');
  if (nav) nav.style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function closeUniqueAnswerList() {
  var nav = document.getElementById('qNav');
  if (nav) nav.style.display = '';
  selectCategory(activeCategory);
}
  </script>
<script src="/assets/js/nav.js"></script>
</body>
</html>
