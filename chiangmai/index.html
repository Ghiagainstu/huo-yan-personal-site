    }).join('');
    var hi = '<ul class="list">'+s.hi.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul>';
    var tp = '<ul class="list">'+s.tips.map(function(t){
      return '<li>'+t.replace('⚠️ ','<span style="color:#c0392b;font-weight:600">⚠️ </span>')+'</li>';
    }).join('')+'</ul>';
    sheet.innerHTML =
      '<div class="sheet-head">' +
        '<span class="big">'+s.emoji+'</span>' +
        '<div class="t"><div class="n">'+s.name+'</div><div class="e">'+s.en+'</div></div>' +
        '<button class="close" id="closeBtn" aria-label="关闭">×</button>' +
      '</div>' +
      '<div class="meta">'+meta+'</div>' +
      '<div class="sec-title">亮点</div>'+hi+
      '<div class="sec-title">实用贴士</div>'+tp+
      (s.imgs ? '<div class="sec-title">参考图</div>'+
        '<div class="gallery">'+s.imgs.map(function(im){return '<img src="'+im+'" alt="'+s.name+'" data-full="'+im+'">';}).join('')+'</div>' : '')+
      (s.name.indexOf('彩虹溶洞')>=0 || s.name.indexOf('黏黏瀑布')>=0
        ? '<div class="warn">提示：溶洞 / 瀑布去前建议确认开放状态，避免扑空。</div>' : '');
    document.getElementById('closeBtn').addEventListener('click', closeSheet);
    var gimgs = sheet.querySelectorAll('.gallery img');
    gimgs.forEach(function(g){
      g.addEventListener('click', function(){
        document.getElementById('lbImg').src = this.getAttribute('data-full');
        document.getElementById('lb').classList.add('open');
      });
    });
    mask.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeSheet(){
    mask.classList.remove('open');
    document.getElementById('lb').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('lb').addEventListener('click', function(){
    this.classList.remove('open');
  });

  grid.addEventListener('click', function(e){
    var c = e.target.closest('.card');
    if(c) openSheet(parseInt(c.getAttribute('data-i'),10));
  });
  mask.addEventListener('click', function(e){ if(e.target===mask) closeSheet(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
</script>

<script>
/* ===== 访问密码门 ===== */
(function(){
  var PASS = '2027'; /* ← 想改密码就改这一行，保存即生效 */
  var gate = document.getElementById('pw-gate');
  var input = document.getElementById('pw-input');
  var btn = document.getElementById('pw-btn');
  var err = document.getElementById('pw-err');
  if (!gate || !input || !btn) return;
  function unlock(){
    gate.style.display = 'none';
    try { sessionStorage.setItem('pwg_ok', '1'); } catch(e) {}
  }
  function check(){
    if (input.value === PASS) { unlock(); }
    else { err.style.display = 'block'; input.value = ''; input.focus(); }
  }
  try {
    if (sessionStorage.getItem('pwg_ok') === '1') { unlock(); return; }
  } catch(e) {}
  gate.style.display = 'flex';
  btn.addEventListener('click', check);
  input.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') check(); });
  setTimeout(function(){ input.focus(); }, 100);
})();
</script>
</body>
</html>
