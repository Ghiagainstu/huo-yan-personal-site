<script>
/* ===== 访问密码门 ===== */
(function(){
  var PASS = '2027'; /* ← 想改密码就改这一行，保存即生效 */
  var gate = document.getElementById('pw-gate');
  var input = document.getElementById('pw-input');
  var btn = document.getElementById('pw-btn');
  var err = document.getElementById('pw-err');
  if (!gate || !input || !btn) return;
  function unlock(){
    gate.style.display = 'none';
    try { sessionStorage.setItem('pwg_ok', '1'); } catch(e) {}
  }
  function check(){
    if (input.value === PASS) { unlock(); }
    else { err.style.display = 'block'; input.value = ''; input.focus(); }
  }
  try {
    if (sessionStorage.getItem('pwg_ok') === '1') { unlock(); return; }
  } catch(e) {}
  gate.style.display = 'flex';
  btn.addEventListener('click', check);
  input.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') check(); });
  setTimeout(function(){ input.focus(); }, 100);
})();
</script>
